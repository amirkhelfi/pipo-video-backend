    }
    .cyber-glow-orange {
      box-shadow: 0 0 25px -5px rgba(249, 115, 22, 0.4);
    }
    .cyber-grid-bg {
      background-image: linear-gradient(to right, rgba(6, 182, 212, 0.04) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

      background: radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 60%);

    ::-webkit-scrollbar-track { background: #070b12; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; border: 1px solid rgba(6, 182, 212, 0.2); }

<body class="cyber-grid-bg min-h-screen selection:bg-cyan-500 selection:text-black">

  <!-- Main React Single File App -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEV_PIN = "pipo2026";
    const DEV_TELEGRAM = "https://t.me/amirx_xpipo";
    const DEV_HANDLE = "@amirx_xpipo";

    // --- Translations Dictionary ---
    const i18n = {
      ar: {
        appName: "PIPO Video Downloader",
        tagline: "تحميل الفيديوهات بدون علامة مائية وبأعلى دقة 4K",
        subtagline: "استخرج مقاطع الفيديو من تيك توك وإنستغرام وفيسبوك ويوتيوب والصوت الأصلي MP3 وصور الألبومات بنقرة واحدة فائقة السرعة.",
        pasteBtn: "لصق",
        extractBtn: "⚡ استخراج",
        extracting: "جاري الاستخراج...",

        aiTab: "استوديو الذكاء الاصطناعي",

        adminTab: "لوحة المطور",
        loginTitle: "تسجيل الدخول إلى منصة PIPO",
        loginDesc: "يرجى إدخال اسمك ولقبك للبدء في استخدام خدمات التحميل",
        firstName: "الاسم الشخصي",
        lastName: "اللقب (اسم العائلة)",
        loginBtn: "دخول إلى المنصة",
        logout: "تسجيل الخروج",
        adminTitle: "لوحة تحكم المطور PIPO",
        adminPinPrompt: "أدخل رمز المرور السري للمطور للوصول للإدارة",
        adminPinPlaceholder: "رمز المرور (PIN)",
        adminLoginBtn: "دخول كمسؤول",
        totalUsers: "إجمالي المستخدمين",
        activeUsers: "المستخدمين النشطين",
        bannedUsers: "المحظورين",
        vipUsers: "أعضاء VIP",
        totalDownloads: "إجمالي التنزيلات"
      },
      en: {
        appName: "PIPO Video Downloader",
        tagline: "Download Videos Without Watermark in 4K Quality",
        subtagline: "Extract videos from TikTok, Instagram Reels, YouTube, Facebook, original MP3 audio, and album photos with ultra-fast speed.",
        pasteBtn: "Paste",
        extractBtn: "⚡ Extract",
        extracting: "Extracting...",
        placeholder: "Paste video link here (TikTok, Instagram, YouTube, Facebook)...",
        downloadHD: "⚡ Download 1080p HD Video (No Watermark)",
        downloadSD: "📹 Download SD Video",
        downloadMP3: "🎵 Download Original MP3 Audio (320kbps)",
        downloadCover: "🖼️ Download HD Thumbnail Cover",
        aiTab: "AI Studio",
        batchTab: "Batch Downloader",
        historyTab: "History & Favs",
        adminTab: "Dev Panel",
        loginTitle: "Login to PIPO Platform",
        loginDesc: "Please enter your first and last name to access download features",
        firstName: "First Name",
        lastName: "Last Name",
        loginBtn: "Enter Platform",
        logout: "Logout",
        adminTitle: "PIPO Developer Dashboard",
        adminPinPrompt: "Enter Developer Secret PIN to access control panel",
        adminPinPlaceholder: "Developer PIN",
        adminLoginBtn: "Login as Admin",
        totalUsers: "Total Users",
        activeUsers: "Active Users",
        bannedUsers: "Banned Users",
        vipUsers: "VIP Members",
        totalDownloads: "Total Downloads"
      }
    };

    function App() {
      const [lang, setLang] = useState('ar');
      const t = i18n[lang];

      const [activeTab, setActiveTab] = useState('downloader');
      const [favOrHistoryView, setFavOrHistoryView] = useState('history');
      
      // User State
      const [user, setUser] = useState(null);
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [isBanned, setIsBanned] = useState(false);
      const [banReason, setBanReason] = useState('');

      // Downloader State
      const [url, setUrl] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [videoData, setVideoData] = useState(null);
      const [history, setHistory] = useState([]);
      const [favorites, setFavorites] = useState([]);
      const [copied, setCopied] = useState(false);

      // Global Announcement
      const [announcement, setAnnouncement] = useState({
        message: 'مرحباً بكم في منصة PIPO لتحميل فيديوهات تيك توك وإنستغرام بأعلى دقة HD وبدون علامة مائية!',
        isActive: true,
        type: 'info'
      });

      // Admin State
      const [adminPin, setAdminPin] = useState('');
      const [isAdminAuthed, setIsAdminAuthed] = useState(false);
      const [usersList, setUsersList] = useState([]);
      const [adminLogs, setAdminLogs] = useState([]);
      const [adminSearch, setAdminSearch] = useState('');
      const [announcementMsg, setAnnouncementMsg] = useState('');
      const [announcementType, setAnnouncementType] = useState('info');
      const [announcementActive, setAnnouncementActive] = useState(true);

      // AI Enhancer State
      const [aiSlider, setAiSlider] = useState(50);
      const [aiProcessing, setAiProcessing] = useState(false);
      const [aiProgress, setAiProgress] = useState(0);
      const [aiStep, setAiStep] = useState('');
      const [aiDone, setAiDone] = useState(false);
      const [aiSharpness, setAiSharpness] = useState(85);
      const [aiContrast, setAiContrast] = useState(120);
      const [aiSaturation, setAiSaturation] = useState(130);
      const [aiAudioDenoise, setAiAudioDenoise] = useState(true);
      const [ai60fps, setAi60fps] = useState(true);

      // Batch State
      const [batchUrls, setBatchUrls] = useState('');
      const [batchItems, setBatchItems] = useState([]);
      const [isBatchLoading, setIsBatchLoading] = useState(false);

      // Initialize App Data
      useEffect(() => {
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;

        // Load saved session
        const savedUser = localStorage.getItem('pipo_user');
        if (savedUser) {
          try {
            const parsed = JSON.parse(savedUser);
            setUser(parsed);
            checkUserBanStatus(parsed);
          } catch {}
        } else {
          setIsLoginOpen(true);
        }

        // Load users database
        const savedDb = localStorage.getItem('pipo_db_users');
        if (savedDb) {
          setUsersList(JSON.parse(savedDb));
        } else {
          const sampleUsers = [
            {
              id: 'usr_demo_1',
              firstName: 'أمير',
              lastName: 'خليفي',
              fullName: 'أمير خليفي',
              ip: '197.112.45.89',
              browser: 'Google Chrome',
              device: 'Android Phone',
              createdAt: new Date().toISOString(),
              isBanned: false,
              isVIP: true,
              downloadsCount: 14
            }
          ];
          setUsersList(sampleUsers);
          localStorage.setItem('pipo_db_users', JSON.stringify(sampleUsers));
        }

        // Load history & favorites
        const savedHist = localStorage.getItem('pipo_history');
        if (savedHist) setHistory(JSON.parse(savedHist));

        const savedFavs = localStorage.getItem('pipo_favorites');
        if (savedFavs) setFavorites(JSON.parse(savedFavs));

        // Load Announcement
        const savedAnn = localStorage.getItem('pipo_announcement');
        if (savedAnn) {
          const parsedAnn = JSON.parse(savedAnn);
          setAnnouncement(parsedAnn);
          setAnnouncementMsg(parsedAnn.message);
          setAnnouncementType(parsedAnn.type);
          setAnnouncementActive(parsedAnn.isActive);
        }
      }, [lang]);

      const checkUserBanStatus = (currentUser) => {
        const dbUsers = JSON.parse(localStorage.getItem('pipo_db_users') || '[]');
        const found = dbUsers.find(u => u.fullName.toLowerCase() === currentUser.fullName.toLowerCase());
        if (found && found.isBanned) {
          setIsBanned(true);
          setBanReason(found.banReason || 'تم الحظر بواسطة لوحة تحكم المطور');
        } else {
          setIsBanned(false);
        }
      };

      const addSystemLog = (action, details, userName = 'Visitor', status = 'info') => {
        const log = {
          id: 'log_' + Date.now(),
          timestamp: new Date().toLocaleTimeString('ar-EG'),
          action,
          details,
          userName,
          status
        };
        const updated = [log, ...adminLogs.slice(0, 50)];
        setAdminLogs(updated);
      };

      // Handle User Login
      const handleLogin = (e) => {
        e.preventDefault();
        const firstName = e.target.firstName.value.trim();
        const lastName = e.target.lastName.value.trim();
        if (!firstName || !lastName) return;

        const fullName = `${firstName} ${lastName}`;
        const dbUsers = JSON.parse(localStorage.getItem('pipo_db_users') || '[]');
        let existing = dbUsers.find(u => u.fullName.toLowerCase() === fullName.toLowerCase());

        if (existing && existing.isBanned) {
          setIsBanned(true);
          setBanReason(existing.banReason || 'تم الحظر بواسطة المطور');
          setUser(existing);
          setIsLoginOpen(false);
          return;
        }

        if (!existing) {
          existing = {
            id: 'usr_' + Date.now(),
            firstName,
            lastName,
            fullName,
            ip: '197.200.' + Math.floor(Math.random() * 200) + '.' + Math.floor(Math.random() * 200),
            browser: navigator.userAgent.includes('Chrome') ? 'Google Chrome' : navigator.userAgent.includes('Firefox') ? 'Firefox' : 'Safari / WebKit',
            device: /Mobile|Android|iPhone/i.test(navigator.userAgent) ? 'Mobile Phone' : 'Desktop PC',
            createdAt: new Date().toISOString(),
            isBanned: false,
            isVIP: false,
            downloadsCount: 0
          };
          dbUsers.push(existing);
          localStorage.setItem('pipo_db_users', JSON.stringify(dbUsers));
        }

        localStorage.setItem('pipo_user', JSON.stringify(existing));
        setUser(existing);
        setUsersList(dbUsers);
        setIsLoginOpen(false);
        addSystemLog('USER_LOGIN', `تسجيل دخول: ${fullName}`, fullName, 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('pipo_user');
        setUser(null);
        setIsBanned(false);
        setIsLoginOpen(true);
      };

      // Universal Extractor (TikTok, Instagram Reels, YouTube, Facebook, Twitter)
      const handleExtract = async (overrideUrl) => {
        const target = (overrideUrl || url).trim();
        if (!target) {
          setError(lang === 'ar' ? 'الرجاء إدخال رابط فيديو صالح' : 'Please enter a valid URL');
          return;
        }
        if (!user) {
          setIsLoginOpen(true);
          return;
        }

        setLoading(true);
        setError(null);
        setVideoData(null);

        try {
          const isInstagram = target.includes('instagram.com') || target.includes('instagr.am');
          const isTikTok = target.includes('tiktok.com') || target.includes('douyin.com');
          const isYouTube = target.includes('youtube.com') || target.includes('youtu.be');
          const isFacebook = target.includes('facebook.com') || target.includes('fb.watch') || target.includes('fb.com');
          const isTwitter = target.includes('twitter.com') || target.includes('x.com');

          let extracted = null;

          // 1. TikTok Extractor (TikWM Engine)
          if (isTikTok) {
            const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(target)}&hd=1`);
            const data = await res.json();
            if (data.code === 0 && data.data) {
              const v = data.data;
              extracted = {
                id: v.id || String(Date.now()),
                title: v.title || 'فيديو تيك توك فائق الدقة بدون علامة مائية',
                cover: v.cover.startsWith('http') ? v.cover : `https://www.tikwm.com${v.cover}`,
                play: v.play.startsWith('http') ? v.play : `https://www.tikwm.com${v.play}`,
                hdplay: v.hdplay ? (v.hdplay.startsWith('http') ? v.hdplay : `https://www.tikwm.com${v.hdplay}`) : v.play,
                music: v.music ? (v.music.startsWith('http') ? v.music : `https://www.tikwm.com${v.music}`) : '',
                duration: v.duration || 0,
                play_count: v.play_count || '25.4K',
                digg_count: v.digg_count || '3.2K',
                comment_count: v.comment_count || '142',
                share_count: v.share_count || '68',
                platform: 'TikTok',
                author: {
                  nickname: v.author?.nickname || 'مستخدم تيك توك',
                  unique_id: v.author?.unique_id || 'tiktok_user',
                  avatar: v.author?.avatar?.startsWith('http') ? v.author.avatar : `https://www.tikwm.com${v.author?.avatar || ''}`
                },
                images: v.images || [],
                originalUrl: target
              };
            }
          }

          // 2. Instagram Reels Extractor
          else if (isInstagram) {
            const shortcodeMatch = target.match(/(?:reel|reels|p|tv|share\/reel)\/([a-zA-Z0-9_-]+)/i);
            const shortcode = shortcodeMatch ? shortcodeMatch[1] : '';

            // Multi-API Instagram Fallback Engine
            try {
              const vkrRes = await fetch(`https://api.vkrdownloader.com/server?v=${encodeURIComponent(target)}`);
              if (vkrRes.ok) {
                const vkrData = await vkrRes.json();
                const stream = vkrData.url || vkrData.download_url || (Array.isArray(vkrData.data) ? vkrData.data[0]?.url : '');
                if (stream) {
                  extracted = {
                    id: shortcode || String(Date.now()),
                    title: vkrData.title || 'فيديو إنستغرام ريلز HD بدون علامة مائية',
                    cover: vkrData.thumbnail || 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=600',
                    play: stream,
                    hdplay: stream,
                    music: stream,
                    duration: 30,
                    play_count: '18.9K',
                    digg_count: '2.4K',
                    comment_count: '88',
                    share_count: '45',
                    platform: 'Instagram',
                    author: {
                      nickname: 'Instagram Creator',
                      unique_id: shortcode ? `reel_${shortcode}` : 'instagram_user',
                      avatar: 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=200'
                    },
                    images: [],
                    originalUrl: target
                  };
                }
              }
            } catch {}

            if (!extracted) {
              try {
                const altRes = await fetch(`https://api.threadsphotodownloader.com/v2/media?url=${encodeURIComponent(target)}`);
                if (altRes.ok) {
                  const altData = await altRes.json();
                  const stream = altData.video_url || altData.url || altData.media?.[0]?.url;
                  if (stream) {
                    extracted = {
                      id: shortcode || String(Date.now()),
                      title: altData.caption || 'فيديو إنستغرام ريلز عالي الجودة',
                      cover: altData.thumbnail || 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=600',
                      play: stream,
                      hdplay: stream,
                      music: stream,
                      duration: 30,
                      play_count: '15K',
                      digg_count: '1.9K',
                      comment_count: '76',
                      share_count: '32',
                      platform: 'Instagram',
                      author: {
                        nickname: 'Instagram User',
                        unique_id: 'instagram',
                        avatar: 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=200'
                      },
                      images: [],
                      originalUrl: target
                    };
                  }
                }
              } catch {}
            }
          }

          // 3. YouTube / Facebook / Universal Extractor Fallback
          if (!extracted) {
            try {
              const uniRes = await fetch(`https://api.vkrdownloader.com/server?v=${encodeURIComponent(target)}`);
              if (uniRes.ok) {
                const uData = await uniRes.json();
                const stream = uData.url || uData.download_url || (Array.isArray(uData.data) ? uData.data[0]?.url : '');
                if (stream) {
                  extracted = {
                    id: String(Date.now()),
                    title: uData.title || 'فيديو تم استخراجه بنجاح بدقة فائقة',
                    cover: uData.thumbnail || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600',
                    play: stream,
                    hdplay: stream,
                    music: stream,
                    duration: 45,
                    play_count: '10K',
                    digg_count: '1.1K',
                    comment_count: '54',
                    share_count: '22',
                    platform: isFacebook ? 'Facebook' : isYouTube ? 'YouTube' : isTwitter ? 'Twitter' : 'Video',
                    author: {
                      nickname: 'Video Creator',
                      unique_id: 'creator',
                      avatar: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200'
                    },
                    images: [],
                    originalUrl: target
                  };
                }
              }
            } catch {}
          }

          if (extracted) {
            setVideoData(extracted);

            // Increment user downloads count
            const updatedDb = usersList.map(u => u.id === user.id ? { ...u, downloadsCount: (u.downloadsCount || 0) + 1 } : u);
            setUsersList(updatedDb);
            localStorage.setItem('pipo_db_users', JSON.stringify(updatedDb));

            // Log activity
            addSystemLog('EXTRACTION_SUCCESS', `تم استخراج فيديو (${extracted.platform}): ${extracted.title.slice(0, 30)}`, user.fullName, 'success');

            confetti({ particleCount: 60, spread: 65, origin: { y: 0.7 } });
          } else {
            setError(lang === 'ar' ? 'تعذر استخراج الفيديو. يرجى التأكد من أن الحساب عام (Public) وأن الرابط صحيح.' : 'Failed to extract video. Make sure account is public.');
            addSystemLog('EXTRACTION_FAILED', `فشل استخراج الرابط: ${target.slice(0, 40)}`, user.fullName, 'error');
          }
        } catch (e) {
          setError(lang === 'ar' ? 'حدث خطأ في الاتصال بالسيرفر. حاول ثانية.' : 'Connection error. Please try again.');
        }
        setLoading(false);
      };

      // Trigger Download to Device
      const triggerDownload = (fileUrl, customName, format = 'video') => {
        if (!fileUrl) return;
        const filename = customName || `PIPO_${Date.now()}.${format === 'audio' ? 'mp3' : 'mp4'}`;

        // Save to History
        const newHist = [{
          id: 'dl_' + Date.now(),
          title: videoData?.title || 'فيديو تم تنزيله',
          authorName: videoData?.author?.nickname || 'مستخدم',
          authorAvatar: videoData?.author?.avatar,
          thumbnail: videoData?.cover,
          downloadUrl: fileUrl,
          platform: videoData?.platform || 'tiktok',
          format,
          timestamp: new Date().toISOString()
        }, ...history.slice(0, 40)];

        setHistory(newHist);
        localStorage.setItem('pipo_history', JSON.stringify(newHist));

        // Create browser download anchor
        const a = document.createElement('a');
        a.href = fileUrl;
        a.download = filename;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        confetti({ particleCount: 75, spread: 70 });
      };

      // Toggle Video In Favorites
      const toggleFavorite = (v) => {
        const isFav = favorites.some(f => f.id === v.id);
        let updated;
        if (isFav) {
          updated = favorites.filter(f => f.id !== v.id);
        } else {
          updated = [{
            id: v.id,
            videoId: v.id,
            title: v.title,
            authorName: v.author?.nickname || 'مستخدم',
            authorAvatar: v.author?.avatar,
            thumbnail: v.cover,
            videoUrl: v.hdplay || v.play,
            platform: v.platform,
            addedAt: new Date().toLocaleDateString('ar-EG')
          }, ...favorites];
        }
        setFavorites(updated);
        localStorage.setItem('pipo_favorites', JSON.stringify(updated));
      };

      // AI Enhancer Simulation
      const startAiProcess = () => {
        setAiProcessing(true);
        setAiProgress(0);
        setAiDone(false);
        const steps = [
          'تهيئة النواة العصبية Super-Resolution...',
          'مضاعفة البيكسلات وتحسين دقة 4K UHD...',
          'توليد الإطارات البينية وحقن سلاسة 60FPS...',
          'تلوين سينمائي وتدرجات Cyber Vivid HDR...',
          'تصدير الملف النهائي المعزز...'
        ];
        let p = 0;
        const it = setInterval(() => {
          p += 5;
          setAiProgress(p);
          const stepIndex = Math.min(Math.floor((p / 100) * steps.length), steps.length - 1);
          setAiStep(steps[stepIndex]);
          if (p >= 100) {
            clearInterval(it);
            setAiProcessing(false);
            setAiDone(true);

            const u = items[i].url;
            const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(u)}&hd=1`);

                        <label className="flex items-center gap-2 cursor-pointer">
                          <input type="checkbox" checked={ai60fps} onChange={(e) => setAi60fps(e.target.checked)} className="accent-orange-500 rounded" />
                          <span className="text-slate-300">مضاعفة السلاسة إلى 60FPS Frame Interpolation</span>
                        </label>
                        <label className="flex items-center gap-2 cursor-pointer">
                          <input type="checkbox" checked={aiAudioDenoise} onChange={(e) => setAiAudioDenoise(e.target.checked)} className="accent-cyan-500 rounded" />
                          <span className="text-slate-300">عزل وتنقية الضوضاء الصوتية (AI Noise Cancellation)</span>
                        </label>
                      </div>
                    </div>

                    <button
                      onClick={startAiProcess}
                      disabled={aiProcessing}
                      className="w-full py-4 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 hover:brightness-110 text-black font-black text-xs uppercase tracking-wider transition-all cyber-glow-orange cursor-pointer"
                    >
                      {aiProcessing ? 'جاري المعالجة العصبية...' : '✨ بدء المعالجة بالذكاء الاصطناعي'}
                    </button>
                  </div>

                </div>
              </div>
            )}

            {/* 3. BATCH DOWNLOADER VIEW */}
            {activeTab === 'batch' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="text-center max-w-xl mx-auto">
                  <h2 className="text-2xl font-black text-white mb-1">تنزيل دفعات الفيديوهات</h2>
                  <p className="text-xs text-slate-400">أدخل روابط متعددة (رابط في كل سطر) لاستخراجها وتحميلها بنقرة واحدة</p>
                </div>

                <div className="bg-[#0a0f1d] border border-cyan-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl">
                  <textarea
                    rows={6}
                    value={batchUrls}
                    onChange={(e) => setBatchUrls(e.target.value)}
                    placeholder="https://vt.tiktok.com/...&#10;https://www.instagram.com/reel/...&#10;https://www.youtube.com/shorts/..."
                    className="w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 text-xs font-mono text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 text-right leading-relaxed"
                  />
                  <button
                    onClick={startBatch}
                    disabled={isBatchLoading}
                    className="w-full mt-4 py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-black text-xs transition-all cyber-glow-cyan"
                  >
                    {isBatchLoading ? 'جاري استخراج جميع الروابط...' : '⚡ استخراج كل الروابط دفعة واحدة'}
                  </button>

                  {/* Batch Items List */}
                  {batchItems.length > 0 && (
                    <div className="mt-6 space-y-3">
                      {batchItems.map((item, idx) => (
                        <div key={idx} className="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between text-right text-xs">
                          <span className="font-mono text-slate-400 truncate max-w-xs">{item.url}</span>
                          <div>
                            {item.status === 'loading' && <span className="text-cyan-400">جاري المعالجة...</span>}
                            {item.status === 'error' && <span className="text-rose-400 font-bold">فشل الاستخراج</span>}
                            {item.status === 'success' && (
                              <a
                                href={item.data?.hdplay || item.data?.play}
                                download
                                target="_blank"
                                className="px-3 py-1 rounded-lg bg-cyan-500 text-black font-bold text-[11px]"
                              >
                                تحميل HD
                              </a>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 4. HISTORY & FAVORITES VIEW */}
            {activeTab === 'history' && (
              <div className="max-w-5xl mx-auto space-y-6">
                <div className="flex items-center justify-between bg-[#0a0f1d] p-4 rounded-3xl border border-slate-800">
                  <div className="flex gap-2">
                    <button
                      onClick={() => setFavOrHistoryView('history')}
                      className={`px-4 py-2 rounded-xl text-xs font-bold ${favOrHistoryView === 'history' ? 'bg-cyan-500 text-black' : 'text-slate-400'}`}
                    >
                      سجل التنزيلات ({history.length})
                    </button>
                    <button
                      onClick={() => setFavOrHistoryView('favorites')}
                      className={`px-4 py-2 rounded-xl text-xs font-bold ${favOrHistoryView === 'favorites' ? 'bg-pink-500 text-white' : 'text-slate-400'}`}
                    >
                      المفضلة ({favorites.length})
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {(favOrHistoryView === 'history' ? history : favorites).map((item) => (
                    <div key={item.id} className="p-4 rounded-2xl bg-[#0a0f1d] border border-slate-800 flex items-center justify-between text-right gap-3">
                      <div className="flex items-center gap-3 overflow-hidden">
                        <img src={item.thumbnail} className="w-12 h-12 rounded-xl object-cover shrink-0" />
                        <div className="truncate">
                          <h4 className="text-xs font-bold text-white truncate">{item.title}</h4>
                          <span className="text-[10px] text-cyan-400 block font-mono">@{item.authorName}</span>
                        </div>
                      </div>
                      <a
                        href={item.downloadUrl || item.videoUrl}
                        download
                        target="_blank"
                        className="px-3.5 py-2 rounded-xl bg-cyan-500 text-black font-bold text-xs shrink-0"
                      >
                        تحميل
                      </a>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 5. DEVELOPER CONTROL PANEL (PIN: pipo2026) */}
            {activeTab === 'admin' && (
              <div className="max-w-6xl mx-auto space-y-6">
                {!isAdminAuthed ? (
                  <div className="max-w-md mx-auto p-8 rounded-3xl bg-[#0a0f1d] border border-cyan-500/40 text-center cyber-glow-cyan">
                    <div className="w-14 h-14 rounded-2xl bg-cyan-950 text-cyan-400 border border-cyan-500/40 mx-auto flex items-center justify-center text-2xl font-black mb-3">
                      🔒
                    </div>
                    <h2 className="text-2xl font-black text-white mb-2">{t.adminTitle}</h2>
                    <p className="text-xs text-slate-400 mb-6">{t.adminPinPrompt}</p>
                    <form onSubmit={handleAdminVerify} className="space-y-4">
                      <input
                        type="password"
                        value={adminPin}
                        onChange={(e) => setAdminPin(e.target.value)}
                        placeholder="pipo2026"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-white text-lg font-mono focus:outline-none focus:border-cyan-500"
                        required
                        autoFocus
                      />
                      <button type="submit" className="w-full py-3.5 rounded-xl bg-cyan-500 text-black font-black text-xs uppercase cyber-glow-cyan">
                        {t.adminLoginBtn}
                      </button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-6">
                    
                    {/* Admin Top Header */}
                    <div className="flex flex-wrap items-center justify-between gap-4 p-6 rounded-3xl bg-[#0a0f1d] border border-cyan-500/30">
                      <div>
                        <h2 className="text-xl font-black text-white">لوحة تحكم المطور PIPO ({DEV_HANDLE})</h2>
                        <p className="text-xs text-slate-400">إدارة المستخدمين، التراخيص، الحظر، ونشر الإشعارات العامة</p>
                      </div>
                      <button onClick={() => setIsAdminAuthed(false)} className="px-4 py-2 rounded-xl bg-rose-950 text-rose-300 text-xs font-bold">
                        خروج من لوحة التحكم
                      </button>
                    </div>

                    {/* Stats Grid */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                      <div className="p-4 rounded-2xl bg-[#0a0f1d] border border-cyan-500/30 text-right">
                        <span className="text-2xl font-black text-white block">{usersList.length}</span>
                        <span className="text-xs text-slate-400">{t.totalUsers}</span>
                      </div>
                      <div className="p-4 rounded-2xl bg-[#0a0f1d] border border-emerald-500/30 text-right">
                        <span className="text-2xl font-black text-white block">{usersList.filter(u => !u.isBanned).length}</span>
                        <span className="text-xs text-slate-400">{t.activeUsers}</span>
                      </div>
                      <div className="p-4 rounded-2xl bg-[#0a0f1d] border border-rose-500/30 text-right">
                        <span className="text-2xl font-black text-white block">{usersList.filter(u => u.isBanned).length}</span>
                        <span className="text-xs text-slate-400">{t.bannedUsers}</span>
                      </div>
                      <div className="p-4 rounded-2xl bg-[#0a0f1d] border border-amber-500/30 text-right">
                        <span className="text-2xl font-black text-white block">{usersList.filter(u => u.isVIP).length}</span>
                        <span className="text-xs text-slate-400">{t.vipUsers}</span>
                      </div>
                    </div>

                    {/* Announcement Broadcast Manager */}
                    <div className="p-6 rounded-3xl bg-[#0a0f1d] border border-cyan-500/30 space-y-4">
                      <h3 className="text-sm font-bold text-white">📢 نشر إشعار وتنبيه عام للمستخدمين</h3>
                      <form onSubmit={handleUpdateAnnouncement} className="space-y-3">
                        <textarea
                          rows={2}
                          value={announcementMsg}
                          onChange={(e) => setAnnouncementMsg(e.target.value)}
                          placeholder="اكتب الإشعار هنا ليظهر أعلى الموقع لجميع الزوار..."
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none text-right"
                        />
                        <div className="flex flex-wrap items-center justify-between gap-3 text-xs">
                          <div className="flex items-center gap-3">
                            <select
                              value={announcementType}
                              onChange={(e) => setAnnouncementType(e.target.value)}
                              className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-white"
                            >
                              <option value="info">أزرق سماوي (معلومة)</option>
                              <option value="success">أخضر (نجاح)</option>
                              <option value="warning">برتقالي (تنبيه)</option>
                              <option value="error">أحمر (عاجل)</option>
                            </select>
                            <label className="flex items-center gap-2 cursor-pointer text-slate-300">
                              <input type="checkbox" checked={announcementActive} onChange={(e) => setAnnouncementActive(e.target.checked)} className="accent-cyan-500" />
                              <span>تفعيل ونشر الإشعار</span>
                            </label>
                          </div>
                          <button type="submit" className="px-5 py-2 rounded-xl bg-cyan-500 text-black font-bold text-xs">
                            تحديث ونشر
                          </button>
                        </div>
                      </form>
                    </div>

                    {/* Users Database Table */}
                    <div className="p-6 rounded-3xl bg-[#0a0f1d] border border-slate-800 space-y-4">
                      <div className="flex justify-between items-center">
                        <h3 className="text-base font-bold text-white">قاعدة بيانات المستخدمين ({filteredUsers.length})</h3>
                        <input
                          type="text"
                          value={adminSearch}
                          onChange={(e) => setAdminSearch(e.target.value)}
                          placeholder="بحث بالاسم أو IP..."
                          className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white text-right"
                        />
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-right text-xs">
                          <thead>
                            <tr className="border-b border-slate-800 text-slate-400">
                              <th className="pb-3">المستخدم</th>
                              <th className="pb-3">عنوان IP</th>
                              <th className="pb-3">الجهاز / المتصفح</th>
                              <th className="pb-3">التنزيلات</th>
                              <th className="pb-3">الحالة</th>
                              <th className="pb-3 text-center">الإجراءات</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800">
                            {filteredUsers.map(u => (
                              <tr key={u.id} className="hover:bg-slate-900/40">
                                <td className="py-3 font-bold text-white">{u.fullName} {u.isVIP && '👑'}</td>
                                <td className="py-3 font-mono text-cyan-300 text-[11px]">{u.ip}</td>
                                <td className="py-3 text-slate-400">{u.device}</td>
                                <td className="py-3 font-bold text-cyan-400">{u.downloadsCount || 0}</td>
                                <td className="py-3">
                                  {u.isBanned ? (
                                    <span className="px-2 py-0.5 rounded bg-rose-950 text-rose-400 text-[10px] font-bold">محظور ⛔</span>
                                  ) : (
                                    <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 text-[10px] font-bold">نشط ✅</span>
                                  )}
                                </td>
                                <td className="py-3 flex justify-center gap-1.5">
                                  <button
                                    onClick={() => toggleBanUser(u.id, u.isBanned)}
                                    className={`px-2 py-1 rounded text-[10px] font-bold ${u.isBanned ? 'bg-emerald-950 text-emerald-400' : 'bg-rose-950 text-rose-400'}`}
                                  >
                                    {u.isBanned ? 'فك الحظر' : 'حظر'}
                                  </button>
                                  <button onClick={() => toggleVipUser(u.id)} className="px-2 py-1 rounded bg-amber-950 text-amber-400 text-[10px]">
                                    VIP
                                  </button>
                                  <button onClick={() => deleteUser(u.id)} className="px-2 py-1 rounded bg-slate-800 text-slate-400 hover:text-rose-300 text-[10px]">
                                    حذف
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* System Activity Logs */}
                    {adminLogs.length > 0 && (
                      <div className="p-6 rounded-3xl bg-[#0a0f1d] border border-slate-800 space-y-3">
                        <h3 className="text-sm font-bold text-white">سجل نشاطات النظام اللحظية</h3>
                        <div className="space-y-1.5 max-h-48 overflow-y-auto text-[11px] font-mono">
                          {adminLogs.map(l => (
                            <div key={l.id} className="p-2 rounded-xl bg-slate-900/60 border border-slate-800 flex justify-between">
                              <span className="text-slate-300">[{l.action}] {l.details}</span>
                              <span className="text-slate-500">{l.timestamp}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                  </div>
                )}
              </div>
            )}

          </main>

          {/* LOGIN MODAL */}
          {isLoginOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md bg-[#0a0f1d] border border-cyan-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl cyber-glow-cyan text-right">
                <h2 className="text-2xl font-black text-white mb-1">{t.loginTitle}</h2>
                <p className="text-xs text-slate-400 mb-6">{t.loginDesc}</p>
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1">{t.firstName}</label>
                    <input name="firstName" required placeholder="مثال: أمير" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-500 text-right" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1">{t.lastName}</label>
                    <input name="lastName" required placeholder="مثال: خليفي" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-500 text-right" />
                  </div>
                  <button type="submit" className="w-full py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-black text-sm cyber-glow-cyan mt-2">
                    {t.loginBtn}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 bg-[#060910] text-slate-400 py-8 text-center text-xs mt-12">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <span className="font-bold text-white">PIPO Video Downloader & AI Studio © 2026</span>
              </div>
              <div className="flex items-center gap-2">
                <span>تطوير وبرمجة المطور:</span>
                <a href={DEV_TELEGRAM} target="_blank" className="text-cyan-400 font-bold hover:underline font-mono">
                  PIPO ({DEV_HANDLE})
                </a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
