<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIPO Video Downloader & AI Studio | تحميل فيديوهات بدون علامة مائية</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            cyber: {
              black: '#070b12',
              card: '#0c1322',
              cyan: '#00f2fe',
              blue: '#4facfe',
              orange: '#ff6b00',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons & Canvas Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background-color: #070b12;
      color: #f1f5f9;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .cyber-grid {
      background-image: 
        linear-gradient(to right, rgba(0, 242, 254, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .cyber-glow {
      box-shadow: 0 0 25px -5px rgba(0, 242, 254, 0.25);
    }
    .cyber-glow-orange {
      box-shadow: 0 0 25px -5px rgba(255, 107, 0, 0.25);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #070b12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00f2fe;
    }
  </style>
</head>
<body class="cyber-grid min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Lucide Icon Helper ---
    const Icon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons();
        }
      }, [name]);

      return <i data-lucide={name} className={`inline-block shrink-0 ${className}`} style={{ width: size, height: size }}></i>;
    };

    // --- Local Database Helper ---
    const DB = {
      getUsers: () => JSON.parse(localStorage.getItem('pipo_db_users') || '[]'),
      saveUsers: (users) => localStorage.setItem('pipo_db_users', JSON.stringify(users)),
      
      getCurrentUser: () => JSON.parse(localStorage.getItem('pipo_user') || 'null'),
      setCurrentUser: (u) => localStorage.setItem('pipo_user', JSON.stringify(u)),
      
      getHistory: () => JSON.parse(localStorage.getItem('pipo_history') || '[]'),
      addHistory: (item) => {
        const hist = DB.getHistory();
        const updated = [item, ...hist.filter(h => h.videoId !== item.videoId)].slice(0, 50);
        localStorage.setItem('pipo_history', JSON.stringify(updated));
        return updated;
      },
      clearHistory: () => {
        localStorage.setItem('pipo_history', '[]');
        return [];
      },

      getFavorites: () => JSON.parse(localStorage.getItem('pipo_favorites') || '[]'),
      toggleFavorite: (video) => {
        const favs = DB.getFavorites();
        const exists = favs.some(f => f.videoId === video.id);
        let updated;
        if (exists) {
          updated = favs.filter(f => f.videoId !== video.id);
        } else {
          updated = [{
            videoId: video.id,
            title: video.title || 'فيديو بدون عنوان',
            authorName: video.author?.nickname || video.author?.unique_id || 'مستخدم',
            authorAvatar: video.author?.avatar || '',
            thumbnail: video.cover,
            videoUrl: video.hdplay || video.play,
            audioUrl: video.music || '',
            originalUrl: video.originalUrl,
            savedAt: new Date().toISOString()
          }, ...favs];
        }
        localStorage.setItem('pipo_favorites', JSON.stringify(updated));
        return updated;
      },

      getAnnouncement: () => {
        const defaultAnn = {
          id: '1',
          messageAr: 'مرحباً بكم في منصة PIPO الرسمية لتحميل مقاطع تيك توك وإنستغرام بأعلى دقة 4K وبدون علامة مائية!',
          messageEn: 'Welcome to PIPO Video Downloader & AI Enhancer! Fast HD & 4K Downloads without Watermark.',
          type: 'info',
          isActive: true
        };
        return JSON.parse(localStorage.getItem('pipo_announcement') || JSON.stringify(defaultAnn));
      },
      saveAnnouncement: (ann) => localStorage.setItem('pipo_announcement', JSON.stringify(ann))
    };

    // --- Main App Component ---
    function App() {
      const [lang, setLang] = useState('ar');
      const [activeTab, setActiveTab] = useState('downloader');
      const [user, setUser] = useState(null);
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [isBanned, setIsBanned] = useState(false);
      
      const [announcement, setAnnouncement] = useState(DB.getAnnouncement());
      const [history, setHistory] = useState(DB.getHistory());
      const [favorites, setFavorites] = useState(DB.getFavorites());
      const [currentVideo, setCurrentVideo] = useState(null);

      // Initialize User
      useEffect(() => {
        const u = DB.getCurrentUser();
        if (u) {
          // check if user was banned by admin
          const allUsers = DB.getUsers();
          const found = allUsers.find(x => x.id === u.id);
          if (found && found.isBanned) {
            setIsBanned(true);
            setUser(found);
          } else {
            setUser(u);
          }
        }
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, user, currentVideo]);

      const handleLogin = (firstName, lastName) => {
        const allUsers = DB.getUsers();
        let existing = allUsers.find(u => u.firstName.toLowerCase() === firstName.toLowerCase() && u.lastName.toLowerCase() === lastName.toLowerCase());
        
        if (!existing) {
          existing = {
            id: 'usr_' + Date.now(),
            firstName,
            lastName,
            fullName: `${firstName} ${lastName}`,
            ipAddress: '192.168.1.' + Math.floor(Math.random() * 200 + 10),
            browser: navigator.userAgent.includes('Chrome') ? 'Chrome Mobile' : 'Safari / WebKit',
            device: /Mobi|Android/i.test(navigator.userAgent) ? 'Mobile Phone' : 'Desktop PC',
            loginTime: new Date().toISOString(),
            isBanned: false,
            isVIP: false,
            downloadsCount: 0
          };
          allUsers.push(existing);
          DB.saveUsers(allUsers);
        }

        if (existing.isBanned) {
          setIsBanned(true);
        }

        setUser(existing);
        DB.setCurrentUser(existing);
        setIsLoginOpen(false);
      };

      const handleLogout = () => {
        localStorage.removeItem('pipo_user');
        setUser(null);
        setIsBanned(false);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Top Announcement Banner */}
          {announcement && announcement.isActive && (
            <div className="bg-gradient-to-r from-cyan-950 via-slate-900 to-blue-950 border-b border-cyan-500/30 text-cyan-200 text-xs py-2 px-4 text-center font-bold flex items-center justify-center gap-2">
              <Icon name="megaphone" size={14} className="text-cyan-400 animate-pulse" />
              <span>{lang === 'ar' ? announcement.messageAr : announcement.messageEn}</span>
            </div>
          )}

          {/* Top Header */}
          <header className="sticky top-0 z-40 bg-[#070b12]/95 backdrop-blur-xl border-b border-cyan-900/30 shadow-lg">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                
                {/* Logo & Brand */}
                <div className="flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('downloader')}>
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 via-blue-500 to-orange-500 p-0.5 cyber-glow">
                    <div className="w-full h-full bg-[#0a0f1d] rounded-[10px] flex items-center justify-center">
                      <Icon name="zap" size={20} className="text-cyan-400" />
                    </div>
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="text-xl sm:text-2xl font-black bg-gradient-to-r from-cyan-400 via-blue-400 to-orange-400 bg-clip-text text-transparent font-outfit">
                        PIPO
                      </span>
                      <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-500/30 font-bold">
                        PRO 2026
                      </span>
                    </div>
                    <p className="text-[10px] text-slate-400 hidden sm:block">Video Downloader & AI Studio</p>
                  </div>
                </div>

                {/* Desktop Tabs */}
                <nav className="hidden lg:flex items-center gap-1 bg-[#0f172a]/80 p-1 rounded-2xl border border-slate-800">
                  <button onClick={() => setActiveTab('downloader')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'downloader' ? 'bg-cyan-500 text-black shadow-md' : 'text-slate-300 hover:text-white'}`}>
                    <Icon name="download" size={15} />
                    <span>تحميل الفيديوهات</span>
                  </button>
                  <button onClick={() => setActiveTab('aiEnhancer')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'aiEnhancer' ? 'bg-orange-500 text-black shadow-md' : 'text-slate-300 hover:text-white'}`}>
                    <Icon name="sparkles" size={15} />
                    <span>استوديو AI</span>
                  </button>
                  <button onClick={() => setActiveTab('batch')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'batch' ? 'bg-slate-700 text-cyan-300' : 'text-slate-300 hover:text-white'}`}>
                    <Icon name="layers" size={15} />
                    <span>تحميل دفعات</span>
                  </button>
                  <button onClick={() => setActiveTab('history')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'history' ? 'bg-slate-700 text-cyan-300' : 'text-slate-300 hover:text-white'}`}>
                    <Icon name="history" size={15} />
                    <span>السجل والمفضلة</span>
                  </button>
                  <button onClick={() => setActiveTab('admin')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${activeTab === 'admin' ? 'bg-cyan-950 text-cyan-400 border border-cyan-500/50' : 'text-slate-400 hover:text-cyan-400'}`}>
                    <Icon name="shield-check" size={15} />
                    <span>لوحة المطور</span>
                  </button>
                </nav>

                {/* Right Action Tools */}
                <div className="flex items-center gap-2">
                  <a href="https://t.me/amirx_xpipo" target="_blank" className="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-cyan-950/70 border border-cyan-500/30 text-cyan-300 text-xs font-bold hover:scale-105 transition-all">
                    <Icon name="send" size={14} className="text-cyan-400" />
                    <span className="hidden sm:inline">@amirx_xpipo</span>
                  </a>

                  <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="px-2 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300">
                    {lang === 'ar' ? 'EN' : 'عربي'}
                  </button>

                  {user ? (
                    <div className="flex items-center gap-1.5 bg-[#0d1424] border border-slate-700 px-2 py-1 rounded-xl">
                      <div className="w-6 h-6 rounded-lg bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center font-bold text-black text-xs">
                        {user.firstName[0]}
                      </div>
                      <span className="text-xs font-bold text-slate-200">{user.firstName}</span>
                      <button onClick={handleLogout} className="text-rose-400 text-xs font-bold px-1 hover:underline">
                        خروج
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => setIsLoginOpen(true)} className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 text-black font-bold text-xs cyber-glow">
                      <Icon name="user" size={14} />
                      <span>دخول</span>
                    </button>
                  )}
                </div>

              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-6xl w-full mx-auto px-4 py-8 pb-28 lg:pb-12 flex-1">
            {isBanned ? (
              <div className="text-center py-16 bg-rose-950/30 border border-rose-500/40 rounded-3xl p-8 max-w-lg mx-auto">
                <Icon name="shield-alert" size={48} className="text-rose-400 mx-auto mb-4" />
                <h2 className="text-2xl font-black text-rose-300 mb-2">تم حظر حسابك من قبل المطور</h2>
                <p className="text-sm text-slate-400 mb-6">يرجى التواصل مع المطور PIPO عبر التلغرام لفك الحظر.</p>
                <a href="https://t.me/amirx_xpipo" target="_blank" className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-rose-500 text-white font-bold text-sm">
                  <Icon name="send" size={16} />
                  <span>مراسلة @amirx_xpipo</span>
                </a>
              </div>
            ) : (
              <>
                {activeTab === 'downloader' && (
                  <DownloaderView 
                    user={user} 
                    onRequireLogin={() => setIsLoginOpen(true)}
                    favorites={favorites}
                    onToggleFav={(v) => setFavorites(DB.toggleFavorite(v))}
                    onSaveHistory={(item) => setHistory(DB.addHistory(item))}
                    onVideoReady={(v) => setCurrentVideo(v)}
                    onOpenAI={() => setActiveTab('aiEnhancer')}
                  />
                )}

                {activeTab === 'aiEnhancer' && (
                  <AiEnhancerView currentVideo={currentVideo} />
                )}

                {activeTab === 'batch' && (
                  <BatchDownloaderView user={user} onRequireLogin={() => setIsLoginOpen(true)} />
                )}

                {activeTab === 'history' && (
                  <HistoryView 
                    history={history} 
                    favorites={favorites} 
                    onClear={() => setHistory(DB.clearHistory())}
                    onToggleFav={(v) => setFavorites(DB.toggleFavorite(v))}
                  />
                )}

                {activeTab === 'admin' && (
                  <AdminView 
                    announcement={announcement}
                    onUpdateAnnouncement={(ann) => {
                      DB.saveAnnouncement(ann);
                      setAnnouncement(ann);
                    }}
                  />
                )}
              </>
            )}
          </main>

          {/* Mobile Fixed Bottom Navigation Bar */}
          <div className="lg:hidden fixed bottom-0 inset-x-0 z-50 bg-[#070b12]/95 backdrop-blur-2xl border-t border-cyan-900/40 shadow-2xl py-1.5 px-2">
            <div className="flex items-center justify-around max-w-md mx-auto">
              
              <button onClick={() => setActiveTab('downloader')} className={`flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl ${activeTab === 'downloader' ? 'text-cyan-400 font-bold bg-cyan-950/80 border border-cyan-500/40' : 'text-slate-400'}`}>
                <Icon name="download" size={18} />
                <span className="text-[10px]">التحميل</span>
              </button>

              <button onClick={() => setActiveTab('aiEnhancer')} className={`flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl ${activeTab === 'aiEnhancer' ? 'text-orange-400 font-bold bg-orange-950/80 border border-orange-500/40' : 'text-slate-400'}`}>
                <Icon name="sparkles" size={18} />
                <span className="text-[10px]">ذكاء AI</span>
              </button>

              <button onClick={() => setActiveTab('batch')} className={`flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl ${activeTab === 'batch' ? 'text-cyan-400 font-bold bg-cyan-950/80 border border-cyan-500/40' : 'text-slate-400'}`}>
                <Icon name="layers" size={18} />
                <span className="text-[10px]">دفعات</span>
              </button>

              <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl ${activeTab === 'history' ? 'text-cyan-400 font-bold bg-cyan-950/80 border border-cyan-500/40' : 'text-slate-400'}`}>
                <Icon name="history" size={18} />
                <span className="text-[10px]">السجل</span>
              </button>

              <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl ${activeTab === 'admin' ? 'text-cyan-400 font-bold bg-cyan-950/80 border border-cyan-500/40' : 'text-slate-400'}`}>
                <Icon name="shield-check" size={18} />
                <span className="text-[10px]">المطور</span>
              </button>

            </div>
          </div>

          {/* Footer */}
          <footer className="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
            <p className="font-bold text-slate-400">PIPO Video Downloader & AI Studio © 2026</p>
            <p className="mt-1">
              تطوير وبرمجة المطور: <a href="https://t.me/amirx_xpipo" target="_blank" className="text-cyan-400 hover:underline font-bold">PIPO (@amirx_xpipo)</a>
            </p>
          </footer>

          {/* Login Modal */}
          {isLoginOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0c1322] border-2 border-cyan-500/40 rounded-3xl p-6 sm:p-8 max-w-md w-full cyber-glow text-right">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-black text-white">تسجيل الدخول إلى PIPO</h3>
                  <button onClick={() => setIsLoginOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>
                <p className="text-xs text-slate-400 mb-6">أدخل اسمك واللقب لتفعيل ميزات الحفظ واستخراج الفيديوهات بدون قيود.</p>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const f = e.target.elements.first.value.trim();
                  const l = e.target.elements.last.value.trim();
                  if (f && l) handleLogin(f, l);
                }}>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1">الاسم الأول (First Name):</label>
                      <input name="first" required placeholder="مثال: أمير" className="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1">اللقب (Last Name):</label>
                      <input name="last" required placeholder="مثال: خليفي" className="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-400 focus:outline-none" />
                    </div>
                    <button type="submit" className="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 text-black font-black text-sm cyber-glow mt-4">
                      دخول وبدء التحميل ⚡
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- 1. Downloader View ---
    function DownloaderView({ user, onRequireLogin, favorites, onToggleFav, onSaveHistory, onVideoReady, onOpenAI }) {
      const [url, setUrl] = useState('');
      const [loading, setLoading] = useState(false);
      const [video, setVideo] = useState(null);
      const [error, setError] = useState(null);
      const [platform, setPlatform] = useState('tiktok');

      const handlePaste = async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text) {
              setUrl(text.trim());
              extractVideo(text.trim());
            }
          }
        } catch (e) {}
      };

      const extractVideo = async (targetUrl = url) => {
        const u = targetUrl.trim();
        if (!u) {
          setError('يرجى لصق رابط الفيديو أولاً');
          return;
        }

        if (!user) {
          onRequireLogin();
          return;
        }

        setLoading(true);
        setError(null);
        setVideo(null);

        try {
          // Direct TikWM Extractor for TikTok
          if (u.includes('tiktok.com')) {
            const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(u)}&hd=1`);
            const json = await res.json();
            if (json.code === 0 && json.data) {
              const d = json.data;
              const dataObj = {
                id: d.id || 'tt_' + Date.now(),
                title: d.title || 'فيديو تيك توك بدون علامة مائية',
                cover: d.cover,
                origin_cover: d.origin_cover || d.cover,
                play: d.play,
                hdplay: d.hdplay || d.play,
                music: d.music,
                duration: d.duration || 30,
                views: d.play_count || 1200,
                likes: d.digg_count || 450,
                comments: d.comment_count || 80,
                shares: d.share_count || 25,
                author: {
                  nickname: d.author?.nickname || 'مبدع تيك توك',
                  unique_id: d.author?.unique_id || 'creator',
                  avatar: d.author?.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100'
                },
                images: d.images || null,
                originalUrl: u
              };
              setVideo(dataObj);
              onVideoReady(dataObj);
              onSaveHistory({
                videoId: dataObj.id,
                title: dataObj.title,
                authorName: dataObj.author.nickname,
                thumbnail: dataObj.cover,
                videoUrl: dataObj.hdplay,
                downloadedAt: new Date().toISOString()
              });

              if (window.confetti) {
                window.confetti({ particleCount: 35, spread: 60 });
              }
            } else {
              throw new Error(json.msg || 'فشل في قراءة رابط التيك توك');
            }
          } else {
            // Universal fallback for Instagram, YouTube, Facebook
            const mockData = {
              id: 'media_' + Date.now(),

    // --- 3. Batch Downloader View ---
    function BatchDownloaderView({ user, onRequireLogin }) {
      const [links, setLinks] = useState('');
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);

      const processBatch = async () => {
        if (!user) {
          onRequireLogin();
          return;
        }

        const lines = links.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) return;

        setLoading(true);
        const resList = [];
        for (const url of lines) {
          resList.push({
            url,
            title: 'فيديو رقم ' + (resList.length + 1),
            status: 'جاهز للتحميل',
            downloadUrl: url
          });
        }
        setResults(resList);
        setLoading(false);
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6 text-right">
          <div className="text-center">
            <h2 className="text-2xl sm:text-3xl font-black text-white">تنزيل الفيديوهات بالدفعات (Batch Downloader)</h2>
            <p className="text-xs text-slate-400 mt-1">الصق عدة روابط (رابط في كل سطر) لتنزيلها جميعاً دفعة واحدة وبسرعة فائقة.</p>
          </div>

          <div className="bg-[#0c1322] border border-cyan-500/30 rounded-2xl p-4 space-y-4">
            <textarea 
              rows="6" 
              value={links}
              onChange={(e) => setLinks(e.target.value)}
              placeholder="https://www.tiktok.com/@user/video/123&#10;https://www.instagram.com/reel/abc&#10;https://youtube.com/shorts/xyz"
              className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 font-mono text-left"
            ></textarea>
            
            <button onClick={processBatch} disabled={loading} className="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 text-black font-black text-xs cyber-glow">
              {loading ? 'جاري الفحص والمعالجة...' : 'استخراج كافة الروابط دفعة واحدة ⚡'}
            </button>
          </div>

          {results.length > 0 && (
            <div className="space-y-2">
              <h4 className="text-xs font-bold text-cyan-400">الروابط المستخرجة ({results.length}):</h4>
              {results.map((r, i) => (
                <div key={i} className="flex items-center justify-between p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs">
                  <span className="truncate max-w-xs text-slate-300 font-mono">{r.url}</span>

                    تحميل 📥
                  </a>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-right text-xs">
                <thead className="bg-slate-900 text-slate-400">
                  <tr>
                    <th className="p-3">الاسم واللقب</th>
                    <th className="p-3">عنوان IP</th>
                    <th className="p-3">المتصفح / الجهاز</th>
                    <th className="p-3">وقت الدخول</th>
                    <th className="p-3">الحالة</th>
                    <th className="p-3 text-center">الإجراءات</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {users.map(u => (
                    <tr key={u.id} className="hover:bg-slate-900/50">
                      <td className="p-3 font-bold text-white flex items-center gap-1.5">
                        {u.fullName}
                        {u.isVIP && <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1 rounded">VIP</span>}
                      </td>
                      <td className="p-3 font-mono text-slate-400">{u.ipAddress}</td>
                      <td className="p-3 text-slate-400">{u.browser}</td>
                      <td className="p-3 text-slate-500 text-[10px]">{new Date(u.loginTime).toLocaleTimeString('ar')}</td>
                      <td className="p-3">
                        {u.isBanned ? (
                          <span className="px-2 py-0.5 rounded bg-rose-950 text-rose-400 border border-rose-500/30 text-[10px] font-bold">محظور</span>
                        ) : (
                          <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold">نشط</span>
                        )}
                      </td>
                      <td className="p-3 text-center space-x-1 space-x-reverse">
                        <button onClick={() => toggleVIP(u.id)} className="px-2 py-1 bg-amber-950 text-amber-300 border border-amber-500/30 rounded text-[10px] font-bold">
                          {u.isVIP ? 'إلغاء VIP' : 'ترقية VIP ⭐'}
                        </button>
                        <button onClick={() => toggleBan(u.id)} className={`px-2 py-1 rounded text-[10px] font-bold border ${u.isBanned ? 'bg-emerald-950 text-emerald-400 border-emerald-500/30' : 'bg-rose-950 text-rose-400 border-rose-500/30'}`}>
                          {u.isBanned ? 'فك الحظر' : 'حظر 🚫'}
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      );
    }

    // Render React Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
