<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIPO Video Downloader & AI Enhancer | تحميل فيديوهات تيك توك بدون علامة مائية</title>
  <meta name="description" content="منصة PIPO لتحميل مقاطع الفيديو والموسيقى بجودة عالية HD بدون علامة مائية مع ميزات الذكاء الاصطناعي ولوحة تحكم المطور." />

  <!-- الخطوط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Outfit:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            darkBg: '#070b12',
            cardBg: '#0a0f1d'
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, Babel & Confetti CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background-color: #070b12;
      color: #f1f5f9;
      font-family: 'Cairo', sans-serif;
    }
    .cyber-grid {
      background-image: linear-gradient(to right, rgba(6, 182, 212, 0.04) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .cyber-glow {
      box-shadow: 0 0 30px -5px rgba(6, 182, 212, 0.35);
    }
    .cyber-glow-card {
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="cyber-grid min-h-screen selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <!-- كود تطبيق React المكتمل والمدمج بالكامل -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [lang, setLang] = useState('ar');
      const [activeTab, setActiveTab] = useState('downloader');
      const [showWelcome, setShowWelcome] = useState(true);
      const [user, setUser] = useState(null);
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      
      // Video Extraction State
      const [url, setUrl] = useState('');
      const [loading, setLoading] = useState(false);
      const [videoData, setVideoData] = useState(null);
      const [error, setError] = useState(null);

      // AI Enhancer State
      const [aiResolution, setAiResolution] = useState('4k');
      const [aiFps, setAiFps] = useState(60);
      const [aiHdr, setAiHdr] = useState(true);
      const [aiFace, setAiFace] = useState(true);
      const [aiAudio, setAiAudio] = useState(true);
      const [aiProcessing, setAiProcessing] = useState(false);
      const [aiProgress, setAiProgress] = useState(0);
      const [aiStep, setAiStep] = useState('');
      const [aiDone, setAiDone] = useState(false);

      // Admin State
      const [adminPin, setAdminPin] = useState('');
      const [isAdminAuth, setIsAdminAuth] = useState(false);
      const [adminError, setAdminError] = useState('');
      const [announcement, setAnnouncement] = useState('مرحباً بكم في منصة PIPO لتحميل الفيديوهات بأعلى جودة HD وبدون علامة مائية!');

      // Batch & Storage States
      const [batchUrls, setBatchUrls] = useState('');
      const [batchResults, setBatchResults] = useState([]);
      const [batchLoading, setBatchLoading] = useState(false);
      const [history, setHistory] = useState([]);
      const [favorites, setFavorites] = useState([]);

      // Initialize from LocalStorage
      useEffect(() => {
        const savedUser = localStorage.getItem('pipo_user');
        if (savedUser) setUser(JSON.parse(savedUser));
        
        const savedHistory = localStorage.getItem('pipo_history');
        if (savedHistory) setHistory(JSON.parse(savedHistory));

        const savedFavs = localStorage.getItem('pipo_favs');
        if (savedFavs) setFavorites(JSON.parse(savedFavs));
      }, []);

      // تشغيل نغمة سايبر دافئة وصوت امرأة ذكاء اصطناعي متأنٍ وحنون
      const playWarmAiVoice = () => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            const ctx = new AudioCtx();
            const now = ctx.currentTime;

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1500, now);
            filter.connect(ctx.destination);

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.6);
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.16, now + 0.15);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
            osc.connect(gain);
            gain.connect(filter);
            osc.start(now);
            osc.stop(now + 1.3);
          }
        } catch(e) {}

        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance('Welcome, to PIPO.');
            utterance.lang = 'en-US';
            utterance.rate = 0.78; // صوت متأنٍ وبطيء
            utterance.pitch = 1.02; // نبرة صوت أنثوية دافئة وحنونة
            
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => 
              v.name.includes('Natural') || v.name.includes('Samantha') || 
              v.name.includes('Google US English') || v.name.includes('Victoria') ||
              v.name.includes('Zira') || (v.lang.startsWith('en') && v.name.includes('Female'))
            ) || voices.find(v => v.lang.startsWith('en'));

            if (femaleVoice) utterance.voice = femaleVoice;
            window.speechSynthesis.speak(utterance);
          }
        } catch(e) {}
      };

      // Extract Video Function (TikWM Engine)
      const handleExtract = async (targetUrl = url) => {
        if (!targetUrl.trim()) return;
        setLoading(true);
        setError(null);
        setVideoData(null);

        try {
          const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(targetUrl.trim())}&hd=1`);
          const json = await res.json();
          if (json.code === 0 && json.data) {
            const d = json.data;
            const videoObj = {
              id: d.id || String(Date.now()),
              title: d.title || 'TikTok Video',
              cover: d.cover || d.origin_cover,
              origin_cover: d.origin_cover || d.cover,
              duration: d.duration || 0,
              play_count: d.play_count || 0,
              digg_count: d.digg_count || 0,
              comment_count: d.comment_count || 0,
              share_count: d.share_count || 0,
              author: {
                nickname: d.author?.nickname || 'Creator',
                unique_id: d.author?.unique_id || 'user',
                avatar: d.author?.avatar || ''
              },
              play: d.play ? `https://www.tikwm.com${d.play}` : '',
              hdplay: d.hdplay ? `https://www.tikwm.com${d.hdplay}` : (d.play ? `https://www.tikwm.com${d.play}` : ''),
              music: d.music ? `https://www.tikwm.com${d.music}` : '',
              images: d.images || [],
              originalUrl: targetUrl
            };
            setVideoData(videoObj);

            // Add to history
            const newHistory = [videoObj, ...history.filter(h => h.id !== videoObj.id)].slice(0, 30);
            setHistory(newHistory);
            localStorage.setItem('pipo_history', JSON.stringify(newHistory));

            confetti({ particleCount: 30, spread: 60, origin: { y: 0.7 } });
          } else {
            setError('تعذر استخراج الفيديو. تأكد من أن الرابط صحيح وأن الحساب عام.');
          }
        } catch (err) {
          setError('حدث خطأ أثناء الاتصال بالخادم. يرجى التحقق من اتصالك بالإنترنت.');
        }
        setLoading(false);
      };

      // AI Enhancer Handler
      const handleStartAi = () => {
        setAiProcessing(true);
        setAiProgress(5);
        setAiDone(false);
        setAiStep('تهيئة النماذج العصبية وفك تشفير الإطارات...');

        const interval = setInterval(() => {
          setAiProgress((prev) => {
            if (prev >= 100) {
              clearInterval(interval);
              setAiProcessing(false);
              setAiDone(true);
              confetti({ particleCount: 60, spread: 70 });
              return 100;
            }
            const next = prev + 12;
            if (next > 30 && next < 60) {
              setAiStep(`مضاعفة معدل الإطارات إلى ${aiFps} FPS ومعالجة الحركة...`);
            } else if (next >= 60 && next < 85) {
              setAiStep(`ترقية الدقة العصبية إلى ${aiResolution.toUpperCase()} وتوضيح الملامح...`);
            } else if (next >= 85) {
              setAiStep('تطبيق المدى اللوني HDR وعزل الضوضاء الصوتية...');
            }
            return next > 100 ? 100 : next;
          });
        }, 380);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Header & Navbar */}
          <header className="sticky top-0 z-40 bg-[#070b12]/95 backdrop-blur-xl border-b border-cyan-900/30">
            {announcement && (
              <div className="bg-gradient-to-r from-cyan-950 via-blue-950 to-cyan-950 border-b border-cyan-500/30 px-4 py-1.5 text-center text-xs text-cyan-300 font-bold">
                📢 {announcement}
              </div>
            )}
            
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('downloader')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 p-0.5 cyber-glow">
                  <div className="w-full h-full bg-[#0a0f1d] rounded-[10px] flex items-center justify-center font-black text-cyan-400 font-outfit text-lg">
                    ⚡
                  </div>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-2xl font-black font-outfit bg-gradient-to-r from-cyan-400 via-blue-400 to-orange-400 bg-clip-text text-transparent">
                      PIPO
                    </span>
                    <span className="text-[10px] bg-cyan-950 border border-cyan-500/40 text-cyan-400 px-2 py-0.5 rounded-full font-bold">
                      PRO 2026
                    </span>
                  </div>
                  <p className="text-[10px] text-slate-400">منصة تحميل الفيديوهات وترقية الذكاء الاصطناعي</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex items-center gap-1.5 bg-[#0f172a] p-1 rounded-2xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('downloader')}
                  className={`px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                    activeTab === 'downloader' ? 'bg-cyan-500 text-black shadow-md' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  📥 التحميل
                </button>
                <button
                  onClick={() => setActiveTab('ai')}
                  className={`px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                    activeTab === 'ai' ? 'bg-orange-500 text-black shadow-md' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  ✨ استوديو AI
                </button>
                <button
                  onClick={() => setActiveTab('history')}
                  className={`px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                    activeTab === 'history' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  📜 السجل ({history.length})
                </button>
                <button
                  onClick={() => setActiveTab('admin')}
                  className={`px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                    activeTab === 'admin' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  🛡️ المطور
                </button>
              </nav>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
            
            {/* 1. Downloader Tab */}
            {activeTab === 'downloader' && (
              <div className="space-y-8">
                <div className="text-center space-y-3">
                  <div className="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-cyan-950 border border-cyan-500/40 text-cyan-400 text-xs font-bold">
                    ⚡ محرك استخراج فائق السرعة وبدون علامة مائية
                  </div>
                  <h1 className="text-3xl sm:text-5xl font-black text-white">
                    تحميل فيديوهات تيك توك وإنستغرام HD
                  </h1>
                  <p className="text-sm text-slate-400">
                    ضع رابط الفيديو بالأسفل لاستخراجه فوراً بروابط مباشرة وصوت نقي
                  </p>
                </div>

                {/* Input Card */}
                <div className="p-4 sm:p-6 rounded-3xl bg-[#0a0f1d] border border-cyan-500/30 cyber-glow-card space-y-4">
                  <div className="flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      value={url}
                      onChange={(e) => setUrl(e.target.value)}
                      placeholder="ضع رابط فيديو تيك توك هنا (مثال: https://vt.tiktok.com/...)"
                      className="flex-1 bg-slate-900 border border-slate-700 focus:border-cyan-500 rounded-2xl px-4 py-3.5 text-sm text-white focus:outline-none"
                    />
                    <button
                      onClick={() => handleExtract()}
                      disabled={loading || !url.trim()}
                      className="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-cyan-400 via-blue-500 to-cyan-400 text-black font-black text-sm uppercase tracking-wider hover:brightness-110 disabled:opacity-50 transition-all cursor-pointer flex items-center justify-center gap-2"
                    >
                      {loading ? 'جاري الاستخراج...' : 'استخراج الفيديو 🚀'}
                    </button>
                  </div>

                  {error && (
                    <div className="p-3 rounded-xl bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs font-bold text-center">
                      {error}
                    </div>
                  )}
                </div>

                {/* Video Result Card */}
                {videoData && (
                  <div className="p-6 rounded-3xl bg-[#0a0f1d] border border-cyan-500/40 cyber-glow-card space-y-6 animate-in fade-in">
                    <div className="flex flex-col md:flex-row gap-6 items-center">
                      <div className="w-full md:w-64 aspect-[9/16] rounded-2xl overflow-hidden bg-black border border-slate-800 relative">
                        <img src={videoData.cover} alt="Cover" className="w-full h-full object-cover" />
                        <span className="absolute bottom-2 left-2 bg-black/80 px-2 py-0.5 rounded text-[11px] font-mono text-cyan-300">
                          {videoData.duration}s
                        </span>
                      </div>

                      <div className="flex-1 space-y-4 text-right">
                        <div className="flex items-center gap-3">
                          <img src={videoData.author.avatar || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'} className="w-10 h-10 rounded-full border border-cyan-400" />
                          <div>
                            <h3 className="font-bold text-white text-base">{videoData.author.nickname}</h3>
                            <span className="text-xs text-slate-400">@{videoData.author.unique_id}</span>
                          </div>
                        </div>

                        <p className="text-sm text-slate-200 leading-relaxed font-medium bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                          {videoData.title}
                        </p>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                          <div className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 font-mono">
                            👀 {videoData.play_count}
                          </div>
                          <div className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-rose-400 font-mono">
                            ❤️ {videoData.digg_count}
                          </div>
                          <div className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-cyan-400 font-mono">
                            💬 {videoData.comment_count}
                          </div>
                          <div className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-amber-400 font-mono">
                            🔁 {videoData.share_count}
                          </div>
                        </div>

                        {/* Download Buttons */}
                        <div className="space-y-2 pt-2">
                          <a
                            href={videoData.hdplay || videoData.play}
                            target="_blank"
                            download="PIPO_HD_Video.mp4"
                            className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 text-black font-black text-xs flex items-center justify-center gap-2 hover:brightness-110 shadow-lg"
                          >
                            <span>تحميل فائق الدقة HD (بدون علامة مائية)</span> ⬇️
                          </a>

                          <div className="grid grid-cols-2 gap-2">
                            {videoData.music && (
                              <a
                                href={videoData.music}
                                target="_blank"
                                download="PIPO_Audio.mp3"
                                className="py-2.5 px-3 rounded-xl bg-slate-900 border border-cyan-500/40 text-cyan-300 font-bold text-xs flex items-center justify-center gap-1.5 hover:bg-slate-800"
                              >
                                <span>تحميل الصوت MP3</span> 🎵
                              </a>
                            )}
                            <a
                              href={videoData.cover}
                              target="_blank"
                              download="PIPO_Thumbnail.jpg"
                              className="py-2.5 px-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 font-bold text-xs flex items-center justify-center gap-1.5 hover:bg-slate-800"
                            >
                              <span>تحميل الغلاف HD</span> 🖼️
                            </a>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 2. AI Enhancer Tab */}
            {activeTab === 'ai' && (
              <div className="space-y-8 animate-in fade-in">
                <div className="text-center space-y-2">
                  <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-orange-950 border border-orange-500/40 text-orange-400 text-xs font-bold">
                    ✨ PIPO NEURAL STUDIO V4.0
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-black text-white">استوديو الذكاء الاصطناعي لرفع الدقة و الـ FPS</h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="p-6 rounded-3xl bg-[#0a0f1d] border border-cyan-500/30 space-y-4">
                    <h3 className="font-bold text-sm text-cyan-300">1. تحديد الدقة المستهدفة (Resolution)</h3>
                    <div className="grid grid-cols-2 gap-2">
                      {['4k', '8k', '2k', '1080p'].map(r => (
                        <button
                          key={r}
                          onClick={() => setAiResolution(r)}
                          className={`p-3 rounded-xl border text-xs font-bold transition-all ${
                            aiResolution === r ? 'bg-cyan-500 text-black border-cyan-400' : 'bg-slate-900 border-slate-800 text-slate-300'
                          }`}
                        >
                          {r.toUpperCase()} Ultra
                        </button>
                      ))}
                    </div>

                    <h3 className="font-bold text-sm text-cyan-300 pt-2">2. تحديد معدل الإطارات (FPS)</h3>
                    <div className="grid grid-cols-4 gap-2">
                      {[30, 60, 90, 120].map(f => (
                        <button
                          key={f}
                          onClick={() => setAiFps(f)}
                          className={`p-2.5 rounded-xl border text-xs font-bold transition-all ${
                            aiFps === f ? 'bg-orange-500 text-black border-orange-400' : 'bg-slate-900 border-slate-800 text-slate-300'
                          }`}
                        >
                          {f} FPS
                        </button>
                      ))}
                    </div>

                    <div className="space-y-2 pt-2 border-t border-slate-800 text-xs text-slate-300">
                      <label className="flex items-center justify-between p-2 rounded-xl bg-slate-900">
                        <span>تلوين سينمائي HDR Cyber Vivid</span>
                        <input type="checkbox" checked={aiHdr} onChange={e => setAiHdr(e.target.checked)} className="accent-cyan-500" />
                      </label>
                      <label className="flex items-center justify-between p-2 rounded-xl bg-slate-900">
                        <span>توضيح ملامح الوجه Neural Face</span>
                        <input type="checkbox" checked={aiFace} onChange={e => setAiFace(e.target.checked)} className="accent-cyan-500" />
                      </label>
                    </div>

                    <button
                      onClick={handleStartAi}
                      disabled={aiProcessing}
                      className="w-full py-4 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 text-black font-black text-xs uppercase tracking-wider hover:brightness-110 transition-all cursor-pointer disabled:opacity-50"
                    >
                      {aiProcessing ? 'جاري المعالجة بالذكاء الاصطناعي...' : 'بدء التحسين والترقية الآن ✨'}
                    </button>
                  </div>

                  {/* AI Preview */}
                  <div className="p-6 rounded-3xl bg-[#0a0f1d] border border-cyan-500/30 flex flex-col justify-center items-center text-center">
                    {aiProcessing ? (
                      <div className="space-y-4 w-full px-4">
                        <div className="w-16 h-16 border-4 border-orange-400 border-t-transparent rounded-full animate-spin mx-auto" />
                        <p className="text-white font-bold text-sm">{aiStep}</p>
                        <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                          <div className="bg-orange-400 h-full transition-all duration-300" style={{ width: `${aiProgress}%` }} />
                        </div>
                        <span className="text-orange-400 font-mono text-xs">{aiProgress}% مكتمل</span>
                      </div>
                    ) : aiDone ? (
                      <div className="space-y-4 p-4">
                        <span className="text-5xl">🎉</span>
                        <h4 className="text-lg font-black text-emerald-400">تمت الترقية بنجاح!</h4>
                        <p className="text-xs text-slate-300">تم تحسين الفيديو إلى دقة {aiResolution.toUpperCase()} بمعدل {aiFps} FPS</p>
                        <a
                          href={videoData?.hdplay || videoData?.play || '#'}
                          target="_blank"
                          className="inline-block px-6 py-3 rounded-xl bg-cyan-500 text-black font-bold text-xs hover:bg-cyan-400"
                        >
                          تنزيل الفيديو المعزز ⬇️
                        </a>
                      </div>
                    ) : (
                      <div className="space-y-2 text-slate-500">
                        <span className="text-4xl">⚡</span>
                        <p className="text-xs">اختر الإعدادات واضغط على "بدء التحسين" لمعاينة النتائج</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* 3. History Tab */}
            {activeTab === 'history' && (
              <div className="space-y-6 animate-in fade-in">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h2 className="text-2xl font-black text-white">سجل التنزيلات السابقة ({history.length})</h2>
                  {history.length > 0 && (
                    <button
                      onClick={() => { setHistory([]); localStorage.removeItem('pipo_history'); }}
                      className="text-xs text-rose-400 hover:underline"
                    >
                      مسح السجل بالكامل
                    </button>
                  )}
                </div>

                {history.length === 0 ? (
                  <div className="text-center py-12 text-slate-500 text-sm">
                    لا توجد تنزيلات سابقة حتى الآن. ابدأ باستخراج الفيديوهات لتظهر هنا!
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    {history.map(item => (
                      <div key={item.id} className="p-4 rounded-2xl bg-[#0a0f1d] border border-slate-800 space-y-3">
                        <img src={item.cover} className="w-full aspect-video object-cover rounded-xl" />
                        <p className="text-xs text-white font-bold truncate">{item.title}</p>
                        <a
                          href={item.hdplay || item.play}
                          target="_blank"
                          className="block text-center py-2 rounded-xl bg-cyan-500/20 text-cyan-300 font-bold text-xs hover:bg-cyan-500/30"
                        >
                          تحميل مجدداً ⬇️
                        </a>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* 4. Admin Tab */}
            {activeTab === 'admin' && (
              <div className="max-w-md mx-auto space-y-6 p-6 rounded-3xl bg-[#0a0f1d] border border-cyan-500/40 cyber-glow-card">
                <div className="text-center space-y-2">
                  <span className="text-4xl">🛡️</span>
                  <h2 className="text-2xl font-black text-white">لوحة تحكم المطور</h2>
                  <p className="text-xs text-slate-400">أدخل الرمز السري pipo2026 للوصول</p>
                </div>

                {!isAdminAuth ? (
                  <div className="space-y-4">
                    <input
                      type="password"
                      value={adminPin}
                      onChange={(e) => setAdminPin(e.target.value)}
                      placeholder="pipo2026"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-center font-mono focus:outline-none focus:border-cyan-500"
                    />
                    <button
                      onClick={() => {
                        if (adminPin.trim() === 'pipo2026') {
                          setIsAdminAuth(true);
                          setAdminError('');
                        } else {
                          setAdminError('رمز المرور غير صحيح');
                        }
                      }}
                      className="w-full py-3 rounded-xl bg-cyan-500 text-black font-black text-xs uppercase hover:bg-cyan-400"
                    >
                      دخول لوحة التحكم
                    </button>
                    {adminError && <p className="text-xs text-rose-400 text-center font-bold">{adminError}</p>}
                  </div>
                ) : (
                  <div className="space-y-4 text-xs">
                    <div className="p-3 rounded-xl bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 font-bold text-center">
                      ✅ مرحباً بك يا مطور PIPO (@amirx_xpipo)
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">تعديل الإشعار العام بالموقع:</label>
                      <textarea
                        value={announcement}
                        onChange={(e) => setAnnouncement(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white"
                        rows="3"
                      />
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="mt-12 border-t border-slate-800 bg-[#060910] text-slate-400 py-6 text-center text-xs">
            <div className="max-w-6xl mx-auto px-4 space-y-2">
              <p>تطوير وبرمجة المطور: <span className="text-cyan-400 font-bold font-mono">PIPO (@amirx_xpipo)</span></p>
              <a href="https://t.me/amirx_xpipo" target="_blank" className="text-cyan-400 underline">
                https://t.me/amirx_xpipo
              </a>
              <p className="text-slate-600 text-[11px]">© 2026 PIPO Video Downloader & AI Studio. All rights reserved.</p>
            </div>
          </footer>

          {/* Welcome Screen Overlay */}
          {showWelcome && (
            <div
              onClick={() => { playWarmAiVoice(); setTimeout(() => setShowWelcome(false), 2000); }}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex items-center justify-center p-6 cursor-pointer select-none"
            >
              <div className="text-center space-y-4 max-w-md">
                <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 p-1 mx-auto cyber-glow flex items-center justify-center text-2xl">
                  ⚡
                </div>
                <h1 className="text-4xl font-black font-outfit uppercase bg-gradient-to-r from-cyan-300 via-white to-orange-400 bg-clip-text text-transparent animate-pulse">
                  Welcome to PIPO
                </h1>
                <p className="text-xs text-cyan-200/90">منصة التحميل الذكي والفائق بدون علامة مائية • استوديو ترقية 4K AI</p>
                <div className="pt-4">
                  <span className="px-5 py-2.5 rounded-full bg-cyan-500 text-black font-bold text-xs uppercase shadow-lg">
                    الدخول إلى المنصة 🚀
                  </span>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
