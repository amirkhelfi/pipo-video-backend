<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIPO Video Downloader & AI Enhancer | تحميل تيك توك بدون علامة مائية</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- React 18, ReactDOM, Babel & Canvas Confetti -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #070b12;
      color: #f1f5f9;
    }
    .cyber-glow-cyan {
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.35);
    }
    .cyber-glow-orange {
      box-shadow: 0 0 25px -5px rgba(249, 115, 22, 0.35);
    }
    .cyber-grid-bg {
      background-image: linear-gradient(to right, rgba(6, 182, 212, 0.04) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #070b12; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; border: 1px solid rgba(6, 182, 212, 0.2); }
    ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
  </style>
</head>
<body class="cyber-grid-bg min-h-screen selection:bg-cyan-500 selection:text-black">

  <div id="root"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEV_PIN = "pipo2026";
    const DEV_TELEGRAM = "https://t.me/amirx_xpipo";
    const DEV_HANDLE = "@amirx_xpipo";

    // --- MAIN APPLICATION COMPONENT ---
    function App() {
      const [lang, setLang] = useState('ar');
      const [activeTab, setActiveTab] = useState('downloader');
      const [user, setUser] = useState(null);
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [isBanned, setIsBanned] = useState(false);
      const [url, setUrl] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [videoData, setVideoData] = useState(null);
      const [copied, setCopied] = useState(false);
      const [history, setHistory] = useState([]);
      const [favorites, setFavorites] = useState([]);
      const [announcement, setAnnouncement] = useState({
        message: 'مرحباً بكم في منصة PIPO لتحميل فيديوهات تيك توك بأعلى دقة HD بدون علامة مائية!',
        isActive: true,
        type: 'info'
      });

      // Admin State
      const [adminPin, setAdminPin] = useState('');
      const [isAdminAuthed, setIsAdminAuthed] = useState(false);
      const [usersList, setUsersList] = useState([]);
      const [adminLogs, setAdminLogs] = useState([]);

      // AI Enhancer State
      const [aiSlider, setAiSlider] = useState(50);
      const [aiProcessing, setAiProcessing] = useState(false);
      const [aiProgress, setAiProgress] = useState(0);
      const [aiStep, setAiStep] = useState('');
      const [aiDone, setAiDone] = useState(false);

      // Batch Downloader State
      const [batchUrls, setBatchUrls] = useState('');
      const [batchItems, setBatchItems] = useState([]);
      const [isBatchLoading, setIsBatchLoading] = useState(false);

      // Load Initial Local Storage
      useEffect(() => {
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;

        const savedUser = localStorage.getItem('pipo_user');
        if (savedUser) {
          const parsed = JSON.parse(savedUser);
          setUser(parsed);
          checkUserStatus(parsed);
        } else {
          setIsLoginOpen(true);
        }

        const savedUsersList = localStorage.getItem('pipo_db_users');
        if (savedUsersList) {
          setUsersList(JSON.parse(savedUsersList));
        }

        const savedHist = localStorage.getItem('pipo_history');
        if (savedHist) setHistory(JSON.parse(savedHist));

        const savedFavs = localStorage.getItem('pipo_favorites');
        if (savedFavs) setFavorites(JSON.parse(savedFavs));
      }, [lang]);

      const checkUserStatus = (currentUser) => {
        const savedUsersList = JSON.parse(localStorage.getItem('pipo_db_users') || '[]');
        const found = savedUsersList.find(u => u.fullName.toLowerCase() === currentUser.fullName.toLowerCase());
        if (found && found.isBanned) {
          setIsBanned(true);
        }
      };

      // Handle Login
      const handleLogin = (e) => {
        e.preventDefault();
        const firstName = e.target.firstName.value.trim();
        const lastName = e.target.lastName.value.trim();
        if (!firstName || !lastName) return;

        const fullName = `${firstName} ${lastName}`;
        const existingUsers = JSON.parse(localStorage.getItem('pipo_db_users') || '[]');
        let existing = existingUsers.find(u => u.fullName.toLowerCase() === fullName.toLowerCase());

        if (existing && existing.isBanned) {
          setIsBanned(true);
          setUser(existing);
          setIsLoginOpen(false);
          return;
        }

        if (!existing) {
          existing = {
            id: 'usr_' + Date.now(),
            firstName,
            lastName,
            fullName,
            ip: 'Client (Direct)',
            browser: navigator.userAgent.includes('Chrome') ? 'Google Chrome' : 'Web Browser',
            device: /Mobile|Android|iPhone/i.test(navigator.userAgent) ? 'Mobile Phone' : 'Desktop PC',
            createdAt: new Date().toISOString(),
            isBanned: false,
            isVIP: false,
            downloadsCount: 0
          };
          existingUsers.push(existing);
        }

        localStorage.setItem('pipo_db_users', JSON.stringify(existingUsers));
        localStorage.setItem('pipo_user', JSON.stringify(existing));
        setUser(existing);
        setUsersList(existingUsers);
        setIsLoginOpen(false);
      };

      const handleLogout = () => {
        localStorage.removeItem('pipo_user');
        setUser(null);
        setIsBanned(false);
        setIsLoginOpen(true);
      };

      // Extract TikTok via TikWM API
      const handleExtract = async (overrideUrl) => {
        const target = (overrideUrl || url).trim();
        if (!target) {
          setError(lang === 'ar' ? 'الرجاء إدخال رابط تيك توك صالح' : 'Please enter a valid TikTok URL');
          return;
        }
        if (!user) {
          setIsLoginOpen(true);
          return;
        }

        setLoading(true);
        setError(null);
        setVideoData(null);

        try {
          const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(target)}&hd=1`);
          const data = await res.json();

          if (data.code === 0 && data.data) {
            const v = data.data;
            const formatted = {
              id: v.id || String(Date.now()),
              title: v.title || 'فيديو تيك توك',
              cover: v.cover.startsWith('http') ? v.cover : `https://www.tikwm.com${v.cover}`,
              play: v.play.startsWith('http') ? v.play : `https://www.tikwm.com${v.play}`,
              hdplay: v.hdplay ? (v.hdplay.startsWith('http') ? v.hdplay : `https://www.tikwm.com${v.hdplay}`) : v.play,
              music: v.music ? (v.music.startsWith('http') ? v.music : `https://www.tikwm.com${v.music}`) : '',
              duration: v.duration || 0,
              play_count: v.play_count || 0,
              digg_count: v.digg_count || 0,
              comment_count: v.comment_count || 0,
              share_count: v.share_count || 0,
              author: {
                nickname: v.author?.nickname || 'مستخدم تيك توك',
                unique_id: v.author?.unique_id || 'tiktok_user',
                avatar: v.author?.avatar?.startsWith('http') ? v.author.avatar : `https://www.tikwm.com${v.author?.avatar || ''}`
              },
              music_info: {
                title: v.music_info?.title || v.music || 'الصوت الأصلي',
                author: v.music_info?.author || v.author?.nickname || ''
              },
              images: v.images || [],
              originalUrl: target
            };

            setVideoData(formatted);

            // Update stats
            const updatedUsers = usersList.map(u => u.id === user.id ? { ...u, downloadsCount: (u.downloadsCount || 0) + 1 } : u);
            setUsersList(updatedUsers);
            localStorage.setItem('pipo_db_users', JSON.stringify(updatedUsers));

            confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
          } else {
            setError(data.msg || (lang === 'ar' ? 'تعذر استخراج الفيديو. تأكد من أن الحساب عام.' : 'Failed to extract video. Make sure account is public.'));
          }
        } catch (e) {
          setError(lang === 'ar' ? 'حدث خطأ في الاتصال بالسيرفر. حاول ثانية.' : 'Connection error. Please try again.');
        }
        setLoading(false);
      };

      // Trigger Direct Download
      const triggerDownload = (fileUrl, customName, format) => {
        if (!fileUrl) return;
        const filename = customName || `PIPO_${Date.now()}.${format === 'audio' ? 'mp3' : 'mp4'}`;
        
        // Save to History
        const newHist = [{
          id: 'dl_' + Date.now(),
          title: videoData?.title || 'فيديو تيك توك',
          author: videoData?.author?.nickname || 'مستخدم',
          thumbnail: videoData?.cover,
          url: fileUrl,
          time: new Date().toLocaleTimeString('ar-EG'),
          format
        }, ...history.slice(0, 30)];
        setHistory(newHist);
        localStorage.setItem('pipo_history', JSON.stringify(newHist));

        // Create link
        const a = document.createElement('a');
        a.href = fileUrl;
        a.download = filename;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        confetti({ particleCount: 70, spread: 70 });
      };

      // Toggle Favorites
      const toggleFavorite = (video) => {
        const exists = favorites.some(f => f.id === video.id);
        let updated;
        if (exists) {
          updated = favorites.filter(f => f.id !== video.id);
        } else {
          updated = [{ ...video, addedAt: new Date().toLocaleDateString('ar-EG') }, ...favorites];
        }
        setFavorites(updated);
        localStorage.setItem('pipo_favorites', JSON.stringify(updated));
      };

      // AI Simulation
      const startAiProcess = () => {
        setAiProcessing(true);
        setAiProgress(0);
        setAiDone(false);
        const steps = ['تهيئة النواة العصبية...', 'مضاعفة البيكسلات بدقة 4K...', 'تحسين التباين وتدرجات HDR...', 'تصدير الملف النهائي...'];
        let p = 0;
        const it = setInterval(() => {
          p += 10;
          setAiProgress(p);
          setAiStep(steps[Math.min(Math.floor((p / 100) * steps.length), steps.length - 1)]);
          if (p >= 100) {
            clearInterval(it);
            setAiProcessing(false);
            setAiDone(true);
            confetti({ particleCount: 90 });
          }
        }, 200);
      };

      // Batch Extraction
      const startBatch = async () => {
        const urls = batchUrls.split('\n').map(l => l.trim()).filter(l => l.includes('tiktok.com'));
        if (urls.length === 0) return alert('الرجاء إدخال روابط تيك توك صالحة');

        setIsBatchLoading(true);
        const items = urls.map((u, i) => ({ id: i, url: u, status: 'loading' }));
        setBatchItems(items);

        for (let i = 0; i < items.length; i++) {
          try {
            const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(items[i].url)}&hd=1`);
            const d = await res.json();
            if (d.code === 0 && d.data) {
              setBatchItems(prev => prev.map(it => it.id === i ? { ...it, status: 'success', data: d.data } : it));
            } else {
              setBatchItems(prev => prev.map(it => it.id === i ? { ...it, status: 'error' } : it));
            }
          } catch {
            setBatchItems(prev => prev.map(it => it.id === i ? { ...it, status: 'error' } : it));
          }
        }
        setIsBatchLoading(false);
      };

      // Admin Actions
      const handleAdminVerify = (e) => {
        e.preventDefault();
        if (adminPin === DEV_PIN) {
          setIsAdminAuthed(true);
        } else {
          alert('رمز المرور PIN غير صحيح!');
        }
      };

      const toggleBanUser = (userId) => {
        const updated = usersList.map(u => u.id === userId ? { ...u, isBanned: !u.isBanned } : u);
        setUsersList(updated);
        localStorage.setItem('pipo_db_users', JSON.stringify(updated));
      };

      const toggleVipUser = (userId) => {
        const updated = usersList.map(u => u.id === userId ? { ...u, isVIP: !u.isVIP } : u);
        setUsersList(updated);
        localStorage.setItem('pipo_db_users', JSON.stringify(updated));
      };

      const deleteUser = (userId) => {
        if (confirm('هل أنت متأكد من حذف المستخدم؟')) {
          const updated = usersList.filter(u => u.id !== userId);
          setUsersList(updated);
          localStorage.setItem('pipo_db_users', JSON.stringify(updated));
        }
      };

      // --- BANNED SCREEN ---
      if (isBanned && user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-[#0e1626] border-2 border-rose-500/60 rounded-3xl p-8 text-center shadow-2xl">
              <div className="w-16 h-16 rounded-full bg-rose-950 text-rose-400 border border-rose-500 mx-auto flex items-center justify-center text-3xl font-black mb-4">⛔</div>
              <h2 className="text-2xl font-black text-white mb-2">الحساب محظور</h2>
              <p className="text-xs text-rose-200 mb-6">عذراً {user.fullName}، تم تقييد وصول حسابك من قبل المطور PIPO.</p>
              <a href={DEV_TELEGRAM} target="_blank" className="block w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs mb-3 transition-all">
                مراسلة المطور PIPO على تيليجرام
              </a>
              <button onClick={handleLogout} className="text-xs text-slate-400 hover:underline">تسجيل الخروج</button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Top Announcement */}
          {announcement.isActive && (
            <div className="bg-cyan-950/90 border-b border-cyan-500/40 text-cyan-200 py-2.5 px-4 text-center text-xs font-bold">
              📢 {announcement.message}
            </div>
          )}

          {/* NAVBAR */}
          <header className="sticky top-0 z-40 bg-[#070b12]/90 backdrop-blur-xl border-b border-cyan-900/30 px-4 py-3.5">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              {/* Logo */}
              <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setActiveTab('downloader')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-orange-500 p-0.5 cyber-glow-cyan">
                  <div className="w-full h-full bg-[#0a0f1d] rounded-[10px] flex items-center justify-center font-black text-cyan-400 text-lg">⚡</div>
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-xl font-black tracking-wider bg-gradient-to-r from-cyan-400 to-orange-400 bg-clip-text text-transparent font-['Outfit']">PIPO</span>
                    <span className="text-[10px] bg-cyan-950 text-cyan-400 px-2 py-0.5 rounded-full border border-cyan-500/30 font-bold">PRO 2026</span>
                  </div>
                  <span className="text-[10px] text-slate-400">Video Downloader & AI Studio</span>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="hidden md:flex items-center gap-1.5 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800 text-xs font-bold">
                <button onClick={() => setActiveTab('downloader')} className={`px-3.5 py-2 rounded-xl transition-all ${activeTab === 'downloader' ? 'bg-cyan-500 text-black shadow-md' : 'text-slate-300 hover:text-white'}`}>
                  📥 {lang === 'ar' ? 'تحميل الفيديوهات' : 'Downloader'}
                </button>
                <button onClick={() => setActiveTab('aiEnhancer')} className={`px-3.5 py-2 rounded-xl transition-all ${activeTab === 'aiEnhancer' ? 'bg-orange-500 text-black shadow-md' : 'text-slate-300 hover:text-white'}`}>
                  ✨ {lang === 'ar' ? 'استوديو الذكاء الاصطناعي' : 'AI Studio'}
                </button>
                <button onClick={() => setActiveTab('batch')} className={`px-3.5 py-2 rounded-xl transition-all ${activeTab === 'batch' ? 'bg-slate-700 text-cyan-300' : 'text-slate-300 hover:text-white'}`}>
                  📑 {lang === 'ar' ? 'تنزيل دفعات' : 'Batch'}
                </button>
                <button onClick={() => setActiveTab('history')} className={`px-3.5 py-2 rounded-xl transition-all ${activeTab === 'history' ? 'bg-slate-700 text-cyan-300' : 'text-slate-300 hover:text-white'}`}>
                  🕒 {lang === 'ar' ? 'السجل والمفضلة' : 'History'}
                </button>
                <button onClick={() => setActiveTab('admin')} className={`px-3 py-2 rounded-xl transition-all ${activeTab === 'admin' ? 'bg-cyan-950 text-cyan-400 border border-cyan-500/50' : 'text-slate-400 hover:text-cyan-400'}`}>
                  🛡️ {lang === 'ar' ? 'لوحة المطور' : 'Dev Panel'}
                </button>
              </nav>

              {/* Right User Tools */}
              <div className="flex items-center gap-2">
                <a href={DEV_TELEGRAM} target="_blank" className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-cyan-950 border border-cyan-500/30 text-cyan-300 text-xs font-bold hover:scale-105 transition-all">
                  ✈️ <span className="hidden sm:inline">{DEV_HANDLE}</span>
                </a>
                <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="px-2.5 py-1.5 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">
                  🌐 {lang === 'ar' ? 'EN' : 'عربي'}
                </button>
                {user ? (
                  <div className="flex items-center gap-2 bg-[#0c1322] border border-slate-700 px-3 py-1.5 rounded-xl text-xs">
                    <span className="font-bold text-cyan-400">👤 {user.firstName}</span>
                    {user.isVIP && <span title="VIP Member">👑</span>}
                    <button onClick={handleLogout} className="text-rose-400 hover:underline mr-2 text-[11px]">خروج</button>
                  </div>
                ) : (
                  <button onClick={() => setIsLoginOpen(true)} className="px-4 py-2 rounded-xl bg-cyan-500 text-black font-bold text-xs cyber-glow-cyan">
                    دخول
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* MAIN BODY CONTENT */}
          <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
            
            {/* 1. DOWNLOADER VIEW */}
            {activeTab === 'downloader' && (
              <div className="space-y-8">
                
                {/* Hero Header */}
                <div className="text-center max-w-3xl mx-auto pt-4">
                  <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-cyan-950 border border-cyan-500/30 text-cyan-400 text-xs font-bold mb-4 cyber-glow-cyan">
                    ⚡ أسرع أداة لاستخراج فيديوهات تيك توك بدون علامة مائية
                  </div>
                  <h1 className="text-3xl sm:text-5xl font-black text-white leading-tight mb-4 font-['Outfit']">
                    تحميل فيديوهات تيك توك <br />
                    <span className="bg-gradient-to-r from-cyan-400 via-blue-400 to-orange-400 bg-clip-text text-transparent">
                      بدون علامة مائية وبأعلى دقة 4K
                    </span>
                  </h1>
                  <p className="text-xs sm:text-sm text-slate-400 max-w-xl mx-auto mb-8 leading-relaxed">
                    استخرج مقاطع الفيديو والصوت الأصلي MP3 وصور الألبومات بنقرة واحدة بجودة فائقة.
                  </p>

                  {/* Input Search Box */}
                  <div className="relative max-w-2xl mx-auto flex flex-col sm:flex-row items-center gap-2 p-2 rounded-2xl bg-[#0c1222] border-2 border-cyan-500/40 cyber-glow-cyan shadow-2xl">
                    <input
                      type="text"
                      value={url}
                      onChange={(e) => setUrl(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleExtract()}
                      placeholder="ضع رابط فيديو تيك توك هنا (مثال: https://vt.tiktok.com/...)"
                      className="w-full bg-transparent px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none text-right"
                    />
                    <div className="flex items-center gap-2 w-full sm:w-auto">
                      <button
                        type="button"
                        onClick={async () => {
                          try {
                            const t = await navigator.clipboard.readText();
                            setUrl(t);
                            handleExtract(t);
                          } catch {}
                        }}
                        className="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-bold shrink-0 w-1/2 sm:w-auto"
                      >
                        📋 لصق
                      </button>
                      <button
                        onClick={() => handleExtract()}
                        disabled={loading || !url.trim()}
                        className="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 hover:brightness-110 text-black font-black text-sm tracking-wide shrink-0 w-1/2 sm:w-auto disabled:opacity-50"
                      >
                        {loading ? 'جاري الاستخراج...' : '⚡ استخراج'}
                      </button>
                    </div>
                  </div>

                  {error && (
                    <div className="max-w-2xl mx-auto mt-4 p-3.5 rounded-2xl bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs text-right font-bold">
                      ⚠️ {error}
                    </div>
                  )}
                </div>

                {/* Video Result Card */}
                {videoData && (
                  <div className="max-w-4xl mx-auto bg-[#0a0f1e] border border-cyan-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl cyber-glow-cyan">
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                      
                      {/* Left: Player */}
                      <div className="lg:col-span-5 flex flex-col items-center">
                        <div className="relative w-full max-w-[280px] aspect-[9/16] rounded-2xl overflow-hidden bg-black border-2 border-slate-800 shadow-xl">
                          <video src={videoData.play} poster={videoData.cover} controls className="w-full h-full object-cover" />
                        </div>
                        <div className="w-full mt-4 flex items-center justify-between p-3 rounded-2xl bg-slate-900 border border-slate-800 text-right">
                          <div className="flex items-center gap-2.5">
                            <img src={videoData.author.avatar} className="w-10 h-10 rounded-full border border-cyan-500/50" />
                            <div>
                              <h4 className="text-xs font-bold text-white leading-tight">{videoData.author.nickname}</h4>
                              <span className="text-[11px] text-cyan-400 font-mono">@{videoData.author.unique_id}</span>
                            </div>
                          </div>
                          <button onClick={() => toggleFavorite(videoData)} className="p-2 rounded-xl bg-slate-800 text-pink-400 text-sm">
                            {favorites.some(f => f.id === videoData.id) ? '❤️' : '🤍'}
                          </button>
                        </div>
                      </div>

                      {/* Right: Info & Download Actions */}
                      <div className="lg:col-span-7 flex flex-col justify-between space-y-6 text-right">
                        <div>
                          <h3 className="text-base sm:text-lg font-bold text-white leading-relaxed mb-4">{videoData.title}</h3>
                          
                          {/* Stats Grid */}
                          <div className="grid grid-cols-4 gap-2 mb-4 text-center">
                            <div className="p-2 rounded-xl bg-slate-900 border border-slate-800">
                              <span className="block text-xs font-bold text-cyan-400">👁️ {videoData.play_count || '12k'}</span>
                              <span className="text-[10px] text-slate-500">مشاهدة</span>
                            </div>
                            <div className="p-2 rounded-xl bg-slate-900 border border-slate-800">
                              <span className="block text-xs font-bold text-pink-400">❤️ {videoData.digg_count || '1.5k'}</span>
                              <span className="text-[10px] text-slate-500">إعجاب</span>
                            </div>
                            <div className="p-2 rounded-xl bg-slate-900 border border-slate-800">
                              <span className="block text-xs font-bold text-blue-400">💬 {videoData.comment_count || '340'}</span>
                              <span className="text-[10px] text-slate-500">تعليق</span>
                            </div>
                            <div className="p-2 rounded-xl bg-slate-900 border border-slate-800">
                              <span className="block text-xs font-bold text-orange-400">🔄 {videoData.share_count || '90'}</span>
                              <span className="text-[10px] text-slate-500">مشاركة</span>
                            </div>
                          </div>
                        </div>

                        {/* Download Actions */}
                        <div className="space-y-3">
                          <button
                            onClick={() => triggerDownload(videoData.hdplay || videoData.play, `PIPO_${videoData.id}_HD.mp4`, 'video')}
                            className="w-full flex items-center justify-between p-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:brightness-110 text-black font-black text-sm transition-all shadow-lg"
                          >
                            <span>⚡ تحميل فائق الدقة 1080p HD (بدون علامة مائية)</span>
                            <span className="px-2 py-0.5 rounded bg-black text-cyan-300 text-xs font-mono">1080p</span>
                          </button>

                          <button
                            onClick={() => triggerDownload(videoData.play, `PIPO_${videoData.id}_SD.mp4`, 'video')}
                            className="w-full flex items-center justify-between p-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 font-bold text-xs"
                          >
                            <span>📹 تحميل الجودة العادية SD</span>
                            <span className="text-xs text-slate-400 font-mono">720p</span>
                          </button>

                          {videoData.music && (
                            <button
                              onClick={() => triggerDownload(videoData.music, `PIPO_${videoData.id}_Audio.mp3`, 'audio')}
                              className="w-full flex items-center justify-between p-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-orange-500/40 text-orange-300 font-bold text-xs"
                            >
                              <span>🎵 تحميل الصوت الأصلي MP3 (نقاوة 320kbps)</span>
                              <span className="px-2 py-0.5 rounded bg-orange-500/20 text-orange-400 text-xs font-mono">MP3</span>
                            </button>
                          )}

                          <button
                            onClick={() => triggerDownload(videoData.cover, `PIPO_${videoData.id}_Cover.jpg`, 'photo')}
                            className="w-full flex items-center justify-between p-3 rounded-2xl bg-slate-900/60 border border-slate-800 text-slate-300 text-xs"
                          >
                            <span>🖼️ تحميل صورة الغلاف المصغرة HD</span>
                            <span className="text-xs text-slate-500">JPG</span>
                          </button>
                        </div>
                      </div>

                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 2. AI STUDIO VIEW */}
            {activeTab === 'aiEnhancer' && (
              <div className="max-w-5xl mx-auto space-y-6">
                <div className="text-center max-w-2xl mx-auto">
                  <span className="text-xs font-bold text-orange-400 bg-orange-950 px-3 py-1 rounded-full border border-orange-500/30">AI Neural Studio</span>
                  <h2 className="text-3xl font-black text-white mt-2 mb-2">استوديو تعزيز الفيديو بالذكاء الاصطناعي</h2>
                  <p className="text-xs text-slate-400">ترقية الدقة إلى 4K، مضاعفة السلاسة إلى 60FPS، تلوين HDR Cyber وعزل الصوت</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 bg-[#0a0f1d] border border-orange-500/30 rounded-3xl p-6 shadow-2xl">
                  <div className="lg:col-span-8">
                    <div className="relative aspect-video rounded-2xl overflow-hidden bg-black border border-slate-800">
                      <img src={videoData?.cover || "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800"} className="w-full h-full object-cover" style={{ filter: 'contrast(140%) saturate(150%) drop-shadow(0 0 2px cyan)' }} />
                      <div className="absolute top-3 left-3 px-2 py-1 rounded bg-orange-500 text-black font-black text-[10px]">AI 4K ENHANCED</div>
                    </div>
                    {aiProcessing && (
                      <div className="mt-4 p-4 rounded-2xl bg-orange-950/60 border border-orange-500/40 text-xs text-orange-300">
                        <div className="flex justify-between mb-1 font-bold"><span>{aiStep}</span><span>{aiProgress}%</span></div>
                        <div className="w-full h-2 bg-slate-900 rounded-full overflow-hidden">
                          <div className="h-full bg-orange-500 transition-all" style={{ width: `${aiProgress}%` }}></div>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="lg:col-span-4 space-y-4 text-right">
                    <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-2">خيارات المعالجة العصبية</h3>
                    <div className="space-y-2 text-xs">
                      <div className="p-3 rounded-xl bg-slate-900 border border-orange-500/30 text-orange-300 font-bold">🚀 4K Super-Resolution</div>
                      <div className="p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-300">⚡ 60FPS Frame Interpolation</div>
                      <div className="p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-300">🎨 Cyber Vivid HDR Grading</div>
                    </div>
                    <button onClick={startAiProcess} disabled={aiProcessing} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-black font-black text-xs hover:brightness-110">
                      {aiProcessing ? 'جاري المعالجة...' : '✨ بدء المعالجة بالذكاء الاصطناعي'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 3. BATCH DOWNLOADER */}
            {activeTab === 'batch' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="text-center max-w-xl mx-auto">
                  <h2 className="text-2xl font-black text-white mb-1">تنزيل دفعات الفيديوهات</h2>
                  <p className="text-xs text-slate-400">أدخل روابط تيك توك متعددة (رابط في كل سطر) لاستخراجها دفعة واحدة</p>
                </div>
                <div className="bg-[#0a0f1d] border border-cyan-500/30 rounded-3xl p-6 shadow-2xl">
                  <textarea
                    rows={5}
                    value={batchUrls}
                    onChange={(e) => setBatchUrls(e.target.value)}
                    placeholder="https://vt.tiktok.com/...&#10;https://www.tiktok.com/@user/video/..."
                    className="w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 text-xs font-mono text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 text-right"
                  />
                  <button onClick={startBatch} disabled={isBatchLoading} className="w-full mt-3 py-3 rounded-xl bg-cyan-500 text-black font-bold text-xs">
                    {isBatchLoading ? 'جاري استخراج الروابط...' : '⚡ استخراج جميع الروابط'}
                  </button>
                </div>
              </div>
            )}

            {/* 4. HISTORY & FAVORITES */}
            {activeTab === 'history' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <h2 className="text-2xl font-black text-white text-right">سجل التنزيلات والمفضلة ({history.length})</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {history.map(item => (
                    <div key={item.id} className="p-4 rounded-2xl bg-[#0a0f1d] border border-slate-800 flex items-center justify-between text-right">
                      <div className="flex items-center gap-3 overflow-hidden">
                        <img src={item.thumbnail} className="w-12 h-12 rounded-xl object-cover" />
                        <div className="truncate">
                          <h4 className="text-xs font-bold text-white truncate">{item.title}</h4>
                          <span className="text-[10px] text-cyan-400">{item.time}</span>
                        </div>
                      </div>
                      <a href={item.url} target="_blank" download className="px-3 py-1.5 rounded-xl bg-cyan-500 text-black text-xs font-bold">تحميل</a>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 5. DEVELOPER CONTROL PANEL */}
            {activeTab === 'admin' && (
              <div className="max-w-5xl mx-auto space-y-6">
                {!isAdminAuthed ? (
                  <div className="max-w-md mx-auto p-8 rounded-3xl bg-[#0a0f1d] border border-cyan-500/40 text-center">
                    <h2 className="text-xl font-black text-white mb-2">لوحة تحكم المطور PIPO</h2>
                    <p className="text-xs text-slate-400 mb-6">أدخل رمز المرور السري للمطور للوصول للإدارة</p>
                    <form onSubmit={handleAdminVerify} className="space-y-4">
                      <input
                        type="password"
                        value={adminPin}
                        onChange={(e) => setAdminPin(e.target.value)}
                        placeholder="PIN (pipo2026)"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-white text-lg font-mono"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-xs">دخول كمسؤول</button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center bg-[#0a0f1d] p-6 rounded-3xl border border-cyan-500/30">
                      <div>
                        <h2 className="text-lg font-black text-white">لوحة تحكم المطور PIPO (@amirx_xpipo)</h2>
                        <span className="text-xs text-slate-400">إجمالي المستخدمين: {usersList.length}</span>
                      </div>
                      <button onClick={() => setIsAdminAuthed(false)} className="text-xs text-rose-400 font-bold">خروج من الإدارة</button>
                    </div>

                    {/* Users Table */}
                    <div className="bg-[#0a0f1d] p-6 rounded-3xl border border-slate-800 overflow-x-auto text-right text-xs">
                      <table className="w-full text-right">
                        <thead>
                          <tr className="border-b border-slate-800 text-slate-400">
                            <th className="pb-3">المستخدم</th>
                            <th className="pb-3">الجهاز</th>
                            <th className="pb-3">التنزيلات</th>
                            <th className="pb-3">الحالة</th>
                            <th className="pb-3 text-center">الإجراءات</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {usersList.map(u => (
                            <tr key={u.id} className="hover:bg-slate-900/40">
                              <td className="py-3 font-bold text-white">{u.fullName} {u.isVIP && '👑'}</td>
                              <td className="py-3 text-slate-400">{u.device}</td>
                              <td className="py-3 text-cyan-400 font-bold">{u.downloadsCount || 0}</td>
                              <td className="py-3">
                                {u.isBanned ? <span className="text-rose-400 font-bold">محظور ⛔</span> : <span className="text-emerald-400 font-bold">نشط ✅</span>}
                              </td>
                              <td className="py-3 flex justify-center gap-2">
                                <button onClick={() => toggleBanUser(u.id)} className="px-2 py-1 rounded bg-rose-950 text-rose-400 text-[10px]">
                                  {u.isBanned ? 'فك الحظر' : 'حظر'}
                                </button>
                                <button onClick={() => toggleVipUser(u.id)} className="px-2 py-1 rounded bg-amber-950 text-amber-400 text-[10px]">
                                  VIP
                                </button>
                                <button onClick={() => deleteUser(u.id)} className="px-2 py-1 rounded bg-slate-800 text-slate-400 text-[10px]">
                                  حذف
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* LOGIN MODAL */}
          {isLoginOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md bg-[#0a0f1d] border border-cyan-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl cyber-glow-cyan text-right">
                <h2 className="text-2xl font-black text-white mb-1">تسجيل الدخول إلى منصة PIPO</h2>
                <p className="text-xs text-slate-400 mb-6">يرجى إدخال اسمك ولقبك للبدء في استخدام خدمات التحميل</p>
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1">الاسم الشخصي</label>
                    <input name="firstName" required placeholder="مثال: أمير" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1">اللقب (اسم العائلة)</label>
                    <input name="lastName" required placeholder="مثال: خليفي" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white" />
                  </div>
                  <button type="submit" className="w-full py-3.5 rounded-xl bg-cyan-500 text-black font-black text-sm cyber-glow-cyan mt-2">
                    دخول إلى المنصة
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800 bg-[#060910] text-slate-400 py-8 text-center text-xs">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <span className="font-bold text-white">PIPO Video Downloader & AI Studio © 2026</span>
              </div>
              <div className="flex items-center gap-2">
                <span>تطوير وبرمجة:</span>
                <a href={DEV_TELEGRAM} target="_blank" className="text-cyan-400 font-bold hover:underline font-mono">
                  PIPO ({DEV_HANDLE})
                </a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
